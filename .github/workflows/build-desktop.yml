name: Build EdAll Desktop Installer
run-name: Build EdAll Desktop Installer
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**"

# GitHub repository Settings must also allow Actions to create/update releases.
permissions:
  contents: write

concurrency:
  group: edall-desktop-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Electron Runtime & Tools
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appRoot = 'staging\runtime\resources\app'
          New-Item -ItemType Directory -Force -Path 'staging\runtime' | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $appRoot 'bin') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $appRoot 'platform') | Out-Null

          # 1. Electron 45.0.0 stable (Windows x64)
          Invoke-WebRequest -Uri "https://github.com/electron/electron/releases/download/v45.0.0/electron-v45.0.0-win32-x64.zip" -OutFile electron.zip
          if (-not (Test-Path 'electron.zip') -or (Get-Item 'electron.zip').Length -lt 50000000) { throw 'Electron archive download is missing or unexpectedly small.' }
          Expand-Archive -LiteralPath electron.zip -DestinationPath 'staging\runtime' -Force
          Remove-Item electron.zip -Force
          if (-not (Test-Path 'staging\runtime\electron.exe')) { throw 'electron.exe was not found in the Electron archive.' }
          Rename-Item -Path 'staging\runtime\electron.exe' -NewName 'EdAll.exe'

          # 2. Keep the existing EdAll site icon; validate and embed it into the actual .exe too.
          Invoke-WebRequest -Uri "https://edall.lovable.app/__l5e/assets-v1/d9e6ad1c-83d1-43cc-8862-35d46ef80b5e/edall.ico" -OutFile 'staging\icon.ico'
          $iconBytes = [System.IO.File]::ReadAllBytes((Resolve-Path 'staging\icon.ico'))
          if ($iconBytes.Length -lt 1024 -or $iconBytes[0] -ne 0 -or $iconBytes[1] -ne 0 -or $iconBytes[2] -ne 1 -or $iconBytes[3] -ne 0) { throw 'The downloaded EdAll icon is not a valid ICO file.' }
          Copy-Item 'staging\icon.ico' (Join-Path $appRoot 'icon.ico') -Force
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile 'rcedit-x64.exe'
          if (-not (Test-Path 'rcedit-x64.exe') -or (Get-Item 'rcedit-x64.exe').Length -lt 100000) { throw 'rcedit download failed.' }
          & '.\rcedit-x64.exe' 'staging\runtime\EdAll.exe' --set-icon 'staging\icon.ico' --set-file-version '2.3.0' --set-product-version '2.3.0' --set-version-string 'ProductName' 'EdAll' --set-version-string 'FileDescription' 'EdAll Education Desktop'
          if ($LASTEXITCODE -ne 0) { throw 'Could not embed the EdAll icon/version resources in EdAll.exe.' }
          Remove-Item 'rcedit-x64.exe' -Force

          # Optional: sign EdAll.exe with a trusted Authenticode certificate if provided.
          # Without these secrets the build still succeeds, but SmartScreen may still warn.
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPass = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCert -xor $hasPass) { throw 'Set both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or leave both empty.' }
          if ($hasCert -and $hasPass) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'edall-signing.pfx'
            [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signTool) { throw 'Windows SDK SignTool was not found on the runner.' }
            & $signTool.FullName sign /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 'staging\runtime\EdAll.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing of EdAll.exe failed.' }
            Write-Host 'EdAll.exe was signed with the supplied certificate.'
          } else {
            Write-Warning 'No Windows code-signing certificate configured; SmartScreen reputation warning may remain.'
          }

          # 3. Download a local fallback copy of the platform and validate it.
          $platformPath = Join-Path $appRoot 'platform\ed_master.html'
          Invoke-WebRequest -Uri "https://edall.lovable.app/ed_master.html" -OutFile $platformPath
          $platformHtml = [System.IO.File]::ReadAllText((Resolve-Path $platformPath))
          if ($platformHtml.Length -lt 100000 -or -not $platformHtml.Contains('async function _edDesktopOpen') -or -not $platformHtml.Contains('</html>')) { throw 'Downloaded platform HTML is incomplete or does not contain the desktop video integration.' }

          # 4. Download pinned current yt-dlp and Deno tools; no self-update at runtime.
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.21/yt-dlp.exe" -OutFile (Join-Path $appRoot 'bin\yt-dlp.exe')
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-pc-windows-msvc.zip" -OutFile 'deno.zip'
          if (-not (Test-Path (Join-Path $appRoot 'bin\yt-dlp.exe')) -or (Get-Item (Join-Path $appRoot 'bin\yt-dlp.exe')).Length -lt 1000000) { throw 'yt-dlp.exe download failed or is too small.' }
          if (-not (Test-Path 'deno.zip') -or (Get-Item 'deno.zip').Length -lt 1000000) { throw 'Deno archive download failed or is too small.' }
          Expand-Archive -LiteralPath deno.zip -DestinationPath (Join-Path $appRoot 'bin') -Force
          Remove-Item deno.zip -Force
          if (-not (Test-Path (Join-Path $appRoot 'bin\deno.exe'))) { throw 'deno.exe was not found after extracting Deno.' }

          # 4. كتابة ملفات التطبيق الداخلية
          @'
          {
            "name": "edall-desktop",
            "productName": "EdAll",
            "version": "2.3.0",
            "private": true,
            "main": "main.cjs"
          }
          '@ | Set-Content staging\runtime\resources\app\package.json -Encoding UTF8

          @'
          const { contextBridge, ipcRenderer } = require('electron');
          if (process.isMainFrame && location.origin === 'https://edall.lovable.app') {
            contextBridge.exposeInMainWorld('edallDesktop', Object.freeze({
              isDesktop: true,
              version: '2.3.0',
              getYoutubeFormats: (id, force = false) => ipcRenderer.invoke('edall:formats', id, force === true),
              setVideoFullscreen: (enabled) => ipcRenderer.invoke('edall:video-fullscreen', enabled === true)
            }));
          }
          '@ | Set-Content staging\runtime\resources\app\preload.cjs -Encoding UTF8

          @'
          <!doctype html>
          <html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>EdAll</title>
          <style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#f2f2f2;font-family:"Segoe UI",Tahoma,sans-serif;text-align:center}a{display:inline-block;padding:12px 28px;border-radius:10px;background:#2f7cf6;color:#fff;text-decoration:none;font-weight:700}</style></head>
          <body><div><h1>تحقق من اتصالك بالإنترنت وأعد تشغيل البرنامج</h1><p>Check your internet connection and restart the app.</p><a href="edall-restart://now">إعادة التشغيل</a></div></body></html>
          '@ | Set-Content staging\runtime\resources\app\offline.html -Encoding UTF8

          # 5. كتابة كود المحرك الرئيسي main.cjs مع دعم الكتابة والقوائم في الأسئلة المقالية
          @'
          const { app, BrowserWindow, ipcMain, Menu, protocol, net, shell } = require('electron');
          const { execFile } = require('node:child_process');
          const fs = require('node:fs/promises');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const ORIGIN = 'https://edall.lovable.app';
          const HOME = ORIGIN + '/ed_master.html';
          const streams = new Map(), jobs = new Map(), cache = new Map();
          let windowRef, toolReady;
          let cachedPlatformHtml = null, platformRefreshPromise = null, lastPlatformRefreshAttempt = 0;
          const getPlatformCachePath = () => path.join(app.getPath('userData'), 'platform.html');
          protocol.registerSchemesAsPrivileged([{ scheme: 'edmedia', privileges: { standard: true, secure: true, stream: true, supportFetchAPI: true, corsEnabled: true } }]);
          const singleInstanceLock = app.requestSingleInstanceLock();
          if (!singleInstanceLock) {
            app.quit();
          }
          app.setAsDefaultProtocolClient('edall');
          const run = (exe, args, timeout = 90000) => new Promise((resolve, reject) => {
            execFile(exe, args, { timeout, maxBuffer: 24 * 1024 * 1024, windowsHide: true }, (err, stdout) => {
              if (err) reject(new Error('Video extraction unavailable; YouTube may require verification.'));
              else resolve(stdout);
            });
          });
          const mediaHost = hostname => hostname === 'googlevideo.com' || hostname.endsWith('.googlevideo.com');
          const frameAllowed = raw => {
            try {
              const url = new URL(raw);
              return url.protocol === 'https:' && [
                'edall.lovable.app', 'youtube.com', 'youtube-nocookie.com', 'dailymotion.com', 'mediadelivery.net', 'bunny.net'
              ].some(host => url.hostname === host || (host !== 'edall.lovable.app' && url.hostname.endsWith('.' + host)));
            } catch { return false; }
          };
          async function prepareTools() {
            // Use the pinned binaries bundled with the installer directly.
            // Do not copy large EXEs to userData on every launch.
            const dir = path.join(__dirname, 'bin');
            for (const name of ['yt-dlp.exe', 'deno.exe']) {
              const file = path.join(dir, name);
              const stat = await fs.stat(file);
              if (!stat.isFile() || stat.size < 1000000) throw new Error(name + ' is missing or invalid');
            }
            return dir;
          }
          function registerStream(format, commonHeaders) {
            const url = new URL(format.url);
            if (url.protocol !== 'https:' || !mediaHost(url.hostname)) throw new Error('Unexpected video source');
            const token = crypto.randomBytes(24).toString('hex');
            const expire = Number(url.searchParams.get('expire')) * 1000 || Date.now() + 3600000;
            const headers = {};
            for (const [key, value] of Object.entries({ ...commonHeaders, ...format.http_headers })) {
              if (['user-agent', 'referer', 'origin', 'accept', 'accept-language'].includes(key.toLowerCase()) && typeof value === 'string' && !/[\r\n]/.test(value)) headers[key] = value;
            }
            streams.set(token, { url: url.href, headers, expire });
            return { url: 'edmedia://stream/' + token, expire };
          }
          async function extract(id, force) {
            const previous = cache.get(id);
            if (!force && previous && previous.expiresAt > Date.now() + 180000) return previous;
            if (jobs.has(id)) return jobs.get(id);
            const task = (async () => {
              const dir = await toolReady;
              const raw = await run(path.join(dir, 'yt-dlp.exe'), [
                '--dump-single-json', '--no-playlist', '--skip-download', '--no-warnings', '--socket-timeout', '15',
                '--js-runtimes', 'deno:' + path.join(dir, 'deno.exe'), 'https://www.youtube.com/watch?v=' + id
              ]);
              const info = JSON.parse(raw);
              const usable = (info.formats || []).filter(f => f.url && /^https:\/\//.test(f.url) && !String(f.protocol || '').includes('m3u8') && !String(f.protocol || '').includes('dash'));
              const audioFormat = usable.filter(f => f.vcodec === 'none' && f.acodec && f.acodec !== 'none' && ['m4a','webm','mp4'].includes(f.ext)).sort((a,b) => (b.abr || 0) - (a.abr || 0))[0];
              const heights = new Map();
              const rank = f => (String(f.vcodec).startsWith('avc1') ? 300000 : String(f.vcodec).startsWith('vp9') ? 200000 : 0) + (f.tbr || 0);
              for (const f of usable) {
                if (!f.height || !f.vcodec || f.vcodec === 'none' || !['mp4','webm'].includes(f.ext)) continue;
                if (f.acodec === 'none' && !audioFormat) continue;
                const old = heights.get(f.height);
                if (!old || rank(f) > rank(old)) heights.set(f.height, f);
              }
              if (!heights.size) throw new Error('No playable video qualities');
              const videos = [...heights.values()].sort((a,b) => b.height - a.height).map(f => ({ h: f.height, hasAudio: !!f.acodec && f.acodec !== 'none', ...registerStream(f, info.http_headers) }));
              const audio = audioFormat ? registerStream(audioFormat, info.http_headers) : null;
              const result = { title: info.title || 'Video', videos, audio, expiresAt: Math.min(...videos.map(v => v.expire), audio ? audio.expire : Infinity) };
              cache.set(id, result);
              for (const [token, stream] of streams) if (stream.expire < Date.now()) streams.delete(token);
              if (cache.size > 30) cache.delete(cache.keys().next().value);
              return result;
            })();
            jobs.set(id, task);
            try { return await task; } finally { jobs.delete(id); }
          }
          const validPlatformHtml = html => typeof html === 'string'
            && html.length > 100000
            && html.includes('async function _edDesktopOpen')
            && html.includes('</html>');

          async function readPlatformCache() {
            if (cachedPlatformHtml && validPlatformHtml(cachedPlatformHtml)) return cachedPlatformHtml;
            try {
              const cachePath = getPlatformCachePath();
              const saved = await fs.readFile(cachePath, 'utf8');
              if (validPlatformHtml(saved)) {
                cachedPlatformHtml = saved;
                return saved;
              }
            } catch (_) {}
            return null;
          }

          async function refreshPlatformInBackground() {
            if (platformRefreshPromise) return platformRefreshPromise;
            lastPlatformRefreshAttempt = Date.now();
            platformRefreshPromise = (async () => {
              const cachePath = getPlatformCachePath();
              const response = await net.fetch(HOME + '?live_sync=' + Date.now(), {
                bypassCustomProtocolHandlers: true,
                signal: AbortSignal.timeout(15000),
                cache: 'no-store'
              });
              if (!response.ok) throw new Error('Platform refresh returned HTTP ' + response.status);
              const next = await response.text();
              if (!validPlatformHtml(next)) throw new Error('Downloaded platform HTML failed validation');
              await fs.mkdir(path.dirname(cachePath), { recursive: true });
              const tempPath = cachePath + '.tmp';
              await fs.writeFile(tempPath, next, 'utf8');
              try {
                await fs.rename(tempPath, cachePath);
              } catch (error) {
                await fs.writeFile(cachePath, next, 'utf8');
                await fs.rm(tempPath, { force: true }).catch(() => {});
              }
              cachedPlatformHtml = next;
              return next;
            })();
            try {
              return await platformRefreshPromise;
            } finally {
              platformRefreshPromise = null;
            }
          }

          async function platformSnapshot() {
            // Fast path: render the validated cached HTML immediately. Refresh remotely in the
            // background, so a slow network does not block opening the window on later launches.
            const saved = await readPlatformCache();
            if (saved) {
              if (Date.now() - lastPlatformRefreshAttempt > 15 * 60 * 1000) {
                lastPlatformRefreshAttempt = Date.now();
                refreshPlatformInBackground().catch(() => {});
              }
              return saved;
            }

            // First launch: no user cache yet, so fetch once; if offline, use the packaged fallback.
            try {
              return await refreshPlatformInBackground();
            } catch (_) {
              const packaged = await fs.readFile(path.join(__dirname, 'platform', 'ed_master.html'), 'utf8');
              if (validPlatformHtml(packaged)) {
                cachedPlatformHtml = packaged;
                try {
                  const cachePath = getPlatformCachePath();
                  await fs.mkdir(path.dirname(cachePath), { recursive: true });
                  await fs.writeFile(cachePath, packaged, 'utf8');
                } catch (_) {}
                return packaged;
              }
              throw new Error('The platform is unavailable and no valid offline copy exists.');
            }
          }
          if (singleInstanceLock) app.whenReady().then(async () => {
            toolReady = prepareTools();
            ipcMain.handle('edall:formats', (event, id, force) => {
              if (!windowRef || event.sender !== windowRef.webContents || event.senderFrame !== event.sender.mainFrame || new URL(event.senderFrame.url).origin !== ORIGIN || !/^[a-zA-Z0-9_-]{11}$/.test(id)) throw new Error('Access denied');
              return extract(id, force === true);
            });
            ipcMain.handle('edall:video-fullscreen', (event, enabled) => {
              if (!windowRef || windowRef.isDestroyed() || event.sender !== windowRef.webContents || event.senderFrame !== event.sender.mainFrame) throw new Error('Access denied');
              const fullscreen = enabled === true;
              if (fullscreen) {
                windowRef.setMenuBarVisibility(false);
                windowRef.setAutoHideMenuBar(true);
              }
              windowRef.setFullScreen(fullscreen);
              return true;
            });
            protocol.handle('https', async request => {
              const url = new URL(request.url);
              if (url.searchParams.has('desktop-update')) return net.fetch(request, { bypassCustomProtocolHandlers: true });
              if (url.origin === ORIGIN && (url.pathname === '/ed_master.html' || url.pathname === '/')) {
                return new Response(await platformSnapshot(), { headers: { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-store' } });
              }
              return net.fetch(request, { bypassCustomProtocolHandlers: true });
            });
            protocol.handle('edmedia', async request => {
              const url = new URL(request.url);
              const stream = url.hostname === 'stream' && streams.get(url.pathname.slice(1));
              if (!stream || stream.expire < Date.now()) return new Response('Expired', { status: 410 });
              const headers = { ...stream.headers };
              const range = request.headers.get('range');
              if (range && /^bytes=\d*-\d*$/.test(range)) headers.Range = range;
              try {
                const upstream = await net.fetch(stream.url, { headers, signal: request.signal, redirect: 'error' });
                const out = new Headers();
                for (const key of ['content-type','content-length','content-range','accept-ranges']) { const value = upstream.headers.get(key); if (value) out.set(key, value); }
                out.set('Access-Control-Allow-Origin', ORIGIN);
                return new Response(upstream.body, { status: upstream.status, headers: out });
              } catch { return new Response('Media unavailable', { status: 502 }); }
            });
            windowRef = new BrowserWindow({ width: 1280, height: 850, title: 'EdAll', icon: path.join(__dirname,'icon.ico'), autoHideMenuBar: true,
              webPreferences: { preload: path.join(__dirname,'preload.cjs'), contextIsolation: true, sandbox: true, nodeIntegration: false, webviewTag: false, devTools: false } });
            windowRef.setContentProtection(true);

            // تفعيل قائمة التعديل (القص والنسخ واللصق) تلقائياً عند النقر الأيمن في الأسئلة المقالية
            windowRef.webContents.on('context-menu', (event, params) => {
              if (params.isEditable) {
                Menu.buildFromTemplate([
                  { role: 'undo', label: 'تراجع' },
                  { role: 'redo', label: 'إعادة' },
                  { type: 'separator' },
                  { role: 'cut', label: 'قص' },
                  { role: 'copy', label: 'نسخ' },
                  { role: 'paste', label: 'لصق' },
                  { role: 'selectAll', label: 'تحديد الكل' }
                ]).popup({ window: windowRef });
              }
            });

            const openOutside = raw => { try { const u = new URL(raw); if (u.protocol === 'https:' || u.protocol === 'http:') shell.openExternal(u.href); } catch {} };
            windowRef.webContents.setWindowOpenHandler(({ url }) => { openOutside(url); return { action: 'deny' }; });
            windowRef.webContents.on('will-navigate', (event, raw) => {
              if (raw.startsWith('edall-restart:')) { event.preventDefault(); app.relaunch(); app.exit(0); return; }
              try { const u = new URL(raw); if (u.origin !== ORIGIN || /\.pdf$/i.test(u.pathname)) { event.preventDefault(); openOutside(raw); } } catch { event.preventDefault(); }
            });
            windowRef.webContents.on('will-frame-navigate', (event, details) => { if (!frameAllowed(details.url)) event.preventDefault(); });
            windowRef.webContents.on('will-attach-webview', event => event.preventDefault());
            windowRef.webContents.on('before-input-event', (event, input) => { if (input.key === 'F12' || (input.control && input.shift && ['i','j','c'].includes((input.key || '').toLowerCase()))) event.preventDefault(); });
            windowRef.webContents.session.setPermissionCheckHandler((_wc, permission) => permission === 'fullscreen');
            windowRef.webContents.session.setPermissionRequestHandler((_wc, permission, callback) => callback(permission === 'fullscreen'));
            const showOffline = () => windowRef.loadFile(path.join(__dirname, 'offline.html'));
            windowRef.webContents.on('did-fail-load', (_e, code, _d, url, isMain) => { if (isMain && code !== -3 && !String(url).startsWith('file:')) showOffline(); });
            // Do not block startup with a separate network preflight. platformSnapshot() will
            // use the validated local cache immediately, refresh in the background, or fall back.
            try {
              await windowRef.loadURL(HOME);
            } catch (_) {
              await showOffline();
            }
          }).catch(() => app.quit());
          if (singleInstanceLock) {
            app.on('second-instance', () => { if (windowRef) { if (windowRef.isMinimized()) windowRef.restore(); windowRef.focus(); } });
            app.on('window-all-closed', () => app.quit());
          }
          '@ | Set-Content staging\runtime\resources\app\main.cjs -Encoding UTF8

      - name: Validate generated application code and runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check 'staging\runtime\resources\app\main.cjs'
          if ($LASTEXITCODE -ne 0) { throw 'main.cjs failed JavaScript syntax validation.' }
          node --check 'staging\runtime\resources\app\preload.cjs'
          if ($LASTEXITCODE -ne 0) { throw 'preload.cjs failed JavaScript syntax validation.' }
          $package = Get-Content 'staging\runtime\resources\app\package.json' -Raw | ConvertFrom-Json
          if ($package.main -ne 'main.cjs' -or $package.version -ne '2.3.0') { throw 'package.json fields are invalid.' }
          foreach ($file in @('staging\runtime\EdAll.exe','staging\runtime\resources\app\icon.ico','staging\runtime\resources\app\bin\yt-dlp.exe','staging\runtime\resources\app\bin\deno.exe')) {
            if (-not (Test-Path $file)) { throw "Required application file is missing: $file" }
          }
          Write-Host 'Generated JavaScript and bundled runtime files passed validation.'

      - name: Compile NSIS Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          @'
          Unicode true
          Name "EdAll"
          OutFile "EdAll-Setup.exe"
          InstallDir "$LOCALAPPDATA\Programs\EdAll"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          Icon "staging\icon.ico"
          UninstallIcon "staging\icon.ico"
          !include "MUI2.nsh"
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !define MUI_FINISHPAGE_RUN "$INSTDIR\EdAll.exe"
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "EdAll"
            SetOutPath "$INSTDIR"
            File /r "staging\runtime\*"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateShortcut "$DESKTOP\EdAll.lnk" "$INSTDIR\EdAll.exe" "" "$INSTDIR\resources\app\icon.ico"
            CreateDirectory "$SMPROGRAMS\EdAll"
            CreateShortcut "$SMPROGRAMS\EdAll\EdAll.lnk" "$INSTDIR\EdAll.exe" "" "$INSTDIR\resources\app\icon.ico"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\EdAll" "DisplayName" "EdAll"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\EdAll" "UninstallString" '"$INSTDIR\Uninstall.exe"'
          SectionEnd
          Section "Uninstall"
            Delete "$DESKTOP\EdAll.lnk"
            RMDir /r "$SMPROGRAMS\EdAll"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\EdAll"
            RMDir /r "$INSTDIR"
          SectionEnd
          '@ | Set-Content staging_installer.nsi -Encoding utf8NoBOM
          & "C:\Program Files (x86)\NSIS\makensis.exe" staging_installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed with exit code $LASTEXITCODE." }

      - name: Validate Installer Output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'EdAll-Setup.exe')) { throw 'EdAll-Setup.exe was not created by NSIS.' }
          $installer = Get-Item 'EdAll-Setup.exe'
          if ($installer.Length -lt 20000000) { throw "Installer is unexpectedly small ($($installer.Length) bytes)." }
          Write-Host "Created $($installer.Name) ($($installer.Length) bytes)."

      - name: Sign Installer (optional)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPass = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCert -xor $hasPass) { throw 'Set both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or leave both empty.' }
          if (-not ($hasCert -and $hasPass)) {
            Write-Warning 'Installer remains unsigned because no trusted certificate was configured.'
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'edall-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK SignTool was not found on the runner.' }
          & $signTool.FullName sign /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 'EdAll-Setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing of EdAll-Setup.exe failed.' }
          & $signTool.FullName verify /pa /v 'EdAll-Setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification of EdAll-Setup.exe failed.' }
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

      # Always make the setup file downloadable even if GitHub Release permissions are blocked.
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-Desktop-Installer
          path: EdAll-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Installer to GitHub Release
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'Education'
          $repo = $env:GH_REPO
          $releaseExists = $false

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }

          if ($releaseExists) {
            Write-Host "Release '$tag' exists; replacing only the EdAll-Setup.exe asset."
            gh release upload $tag 'EdAll-Setup.exe' --clobber --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'GitHub could not upload the installer asset. Check repository Actions permissions.' }
            gh release edit $tag --title 'EdAll Desktop v2.3.0' --notes 'EdAll Desktop installer. Download EdAll-Setup.exe and run it on Windows x64.' --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'Installer uploaded, but GitHub could not update the release title/notes.' }
          } else {
            Write-Host "Release '$tag' was not found; creating it."
            gh release create $tag 'EdAll-Setup.exe' --title 'EdAll Desktop v2.3.0' --notes 'EdAll Desktop installer. Download EdAll-Setup.exe and run it on Windows x64.' --repo $repo
            if ($LASTEXITCODE -ne 0) { throw 'GitHub could not create the release. Check repository Actions permissions.' }
          }
