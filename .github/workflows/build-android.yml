          # 9. Default app icon
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          curl -sL "https://edall.lovable.app/__l5e/assets-v1/71bdb918-9fe9-4771-a708-5fa36185f009/edall.png" -o android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png

          # 10. Generate Gradle Wrapper 8.6
          cat << 'EOF' > android-project/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Signed Release APK
        working-directory: android-project
        run: |
          gradle assembleRelease --stacktrace

          # Find unsigned APK
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"

          # Generate Release Keystore and Sign APK
          keytool -genkey -v -keystore release.keystore -alias edall -keyalg RSA -keysize 2048 -validity 10000 -storepass edallpass -keypass edallpass -dname "CN=EdAll, OU=App, O=EdAll, L=Cairo, S=Cairo, C=EG"
          
          # Sign with jarsigner
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass edallpass -keypass edallpass "$APK_PATH" edall

          mkdir -p ../dist
          cp "$APK_PATH" ../dist/EdAll.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-Android-APK
          path: dist/EdAll.apk
          if-no-files-found: error

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: Education
          name: "EdAll Education Release"
          files: dist/EdAll.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
