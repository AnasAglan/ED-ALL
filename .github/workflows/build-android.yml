          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/edall/platform/OkHttpDownloader.java
          package com.edall.platform;

          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException;

          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.TimeUnit;

          import okhttp3.Cookie;
          import okhttp3.CookieJar;
          import okhttp3.HttpUrl;
          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.RequestBody;
          import okhttp3.ResponseBody;

          public class OkHttpDownloader extends Downloader {
              private static OkHttpDownloader instance;
              private final OkHttpClient client;
              private final Map<String, List<Cookie>> cookieStore = new ConcurrentHashMap<>();

              private OkHttpDownloader() {
                  this.client = new OkHttpClient.Builder()
                          .connectTimeout(25, TimeUnit.SECONDS)
                          .readTimeout(30, TimeUnit.SECONDS)
                          .cookieJar(new CookieJar() {
                              @Override
                              public void saveFromResponse(HttpUrl url, List<Cookie> cookies) {
                                  cookieStore.put(url.host(), cookies);
                              }
                              @Override
                              public List<Cookie> loadForRequest(HttpUrl url) {
                                  List<Cookie> cookies = cookieStore.get(url.host());
                                  return cookies != null ? cookies : Collections.emptyList();
                              }
                          })
                          .followRedirects(true)
                          .followSslRedirects(true)
                          .build();
              }

              public static synchronized OkHttpDownloader getInstance() {
                  if (instance == null) {
                      instance = new OkHttpDownloader();
                  }
                  return instance;
              }

              @Override
              public Response execute(Request request) throws IOException, ReCaptchaException {
                  String httpMethod = request.httpMethod();
                  String url = request.url();
                  byte[] dataToSend = request.dataToSend();

                  RequestBody requestBody = null;
                  if ("POST".equalsIgnoreCase(httpMethod) || "PUT".equalsIgnoreCase(httpMethod)) {
                      byte[] bodyBytes = (dataToSend != null) ? dataToSend : new byte[0];
                      requestBody = RequestBody.create(bodyBytes, MediaType.parse("application/json; charset=utf-8"));
                  }

                  okhttp3.Request.Builder okReqBuilder = new okhttp3.Request.Builder()
                          .url(url)
                          .method(httpMethod, requestBody);

                  Map<String, List<String>> headers = request.headers();
                  boolean hasUserAgent = false;
                  if (headers != null) {
                      for (Map.Entry<String, List<String>> entry : headers.entrySet()) {
                          String headerName = entry.getKey();
                          if ("User-Agent".equalsIgnoreCase(headerName)) hasUserAgent = true;
                          for (String value : entry.getValue()) {
                              okReqBuilder.addHeader(headerName, value);
                          }
                      }
                  }
                  if (!hasUserAgent) {
                      okReqBuilder.addHeader("User-Agent", "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36");
                  }

                  okhttp3.Response okResponse = client.newCall(okReqBuilder.build()).execute();
                  int responseCode = okResponse.code();

                  if (responseCode == 429) {
                      okResponse.close();
                      throw new ReCaptchaException("reCAPTCHA requested by YouTube", url);
                  }

                  ResponseBody body = okResponse.body();
                  String responseBody = (body != null) ? body.string() : "";
                  String responseMessage = okResponse.message();

                  Map<String, List<String>> responseHeaders = new HashMap<>();
                  for (String name : okResponse.headers().names()) {
                      responseHeaders.put(name, new ArrayList<>(okResponse.headers(name)));
                  }

                  return new Response(responseCode, responseMessage, responseHeaders, responseBody, okResponse.request().url().toString());
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/edall/platform/WebAppInterface.java
          package com.edall.platform;

          import android.webkit.JavascriptInterface;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.ServiceList;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.StreamInfo;
          import org.schabi.newpipe.extractor.stream.VideoStream;

          import java.util.List;

          public class WebAppInterface {
              private final MainActivity activity;

              public WebAppInterface(MainActivity activity) {
                  this.activity = activity;
              }

              @JavascriptInterface
              public void getYoutubeFormats(final String rawUrl, final String callbackFn) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String videoUrl = rawUrl;
                              if (videoUrl.contains("youtu.be/")) {
                                  String id = videoUrl.substring(videoUrl.lastIndexOf('/') + 1).split("\\?")[0];
                                  videoUrl = "https://www.youtube.com/watch?v=" + id;
                              } else if (videoUrl.contains("embed/")) {
                                  String id = videoUrl.substring(videoUrl.indexOf("embed/") + 6).split("\\?")[0];
                                  videoUrl = "https://www.youtube.com/watch?v=" + id;
                              }

                              StreamInfo streamInfo = StreamInfo.getInfo(ServiceList.YouTube, videoUrl);
                              List<VideoStream> videoStreams = streamInfo.getVideoStreams();
                              List<AudioStream> audioStreams = streamInfo.getAudioStreams();

                              JSONObject result = new JSONObject();
                              JSONArray formatsArray = new JSONArray();

                              for (VideoStream vs : videoStreams) {
                                  JSONObject fmt = new JSONObject();
                                  fmt.put("format_id", vs.getFormat() != null ? vs.getFormat().getName() : "mp4");
                                  fmt.put("resolution", vs.getResolution());
                                  fmt.put("height", vs.getResolution().replaceAll("[^0-9]", ""));
                                  fmt.put("ext", vs.getFormat() != null ? vs.getFormat().getSuffix() : "mp4");
                                  fmt.put("url", vs.getUrl());
                                  fmt.put("has_audio", !vs.isVideoOnly());
                                  formatsArray.put(fmt);
                              }

                              String bestAudioUrl = null;
                              if (audioStreams != null && !audioStreams.isEmpty()) {
                                  bestAudioUrl = audioStreams.get(0).getUrl();
                              }

                              result.put("formats", formatsArray);
                              result.put("best_audio", bestAudioUrl);
                              result.put("title", streamInfo.getName());
                              result.put("duration", streamInfo.getDuration());

                              final String jsonStr = result.toString();
                              activity.runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      activity.getWebView().evaluateJavascript(callbackFn + "(null, " + jsonStr + ");", null);
                                  }
                              });
                          } catch (final Exception e) {
                              activity.runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      activity.getWebView().evaluateJavascript(
                                          callbackFn + "(JSON.stringify({error: " + JSONObject.quote(e.getMessage()) + ", fallback: true}), null);",
                                          null
                                      );
                                  }
                              });
                          }
                      }
                  }).start();
              }

              @JavascriptInterface
              public void setVideoFullscreen(final boolean fullscreen) {
                  activity.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          activity.toggleFullscreen(fullscreen);
                      }
                  });
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/edall/platform/MainActivity.java
          package com.edall.platform;

          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.localization.ContentCountry;
          import org.schabi.newpipe.extractor.localization.Localization;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final String APP_URL = "https://edall.lovable.app/ed_master.html";

              private static final String OFFLINE_HTML = "<!DOCTYPE html><html dir='rtl' lang='ar'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{margin:0;background:#020617;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;padding:20px;text-align:center;box-sizing:border-box}.card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:32px 24px;max-width:400px;width:100%;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5)}.icon{width:64px;height:64px;margin:0 auto 20px;background:rgba(239,68,68,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#ef4444;font-size:32px}h2{font-size:20px;margin:0 0 12px;font-weight:700}p{color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 24px}button{background:#0ea5e9;color:#fff;border:none;padding:12px 24px;border-radius:10px;font-size:15px;font-weight:600;width:100%;cursor:pointer}</style></head><body><div class='card'><div class='icon'>!</div><h2>لا يوجد اتصال بالإنترنت</h2><p>تحقق من اتصالك بالإنترنت ثم اضغط على زر إعادة المحاولة.</p><button onclick='location.reload()'>إعادة المحاولة</button></div></body></html>";

              private static final String JS_BRIDGE_SHIM =
                  "window.edallAndroid = true;" +
                  "(function(){" +
                  "  try {" +
                  "    var hero = document.getElementById('desktopDownloadHero');" +
                  "    if (hero) hero.style.display = 'none';" +
                  "    var style = document.createElement('style');" +
                  "    style.innerHTML = '#desktopDownloadHero { display: none !important; }';" +
                  "    document.head.appendChild(style);" +
                  "  } catch(e){}" +
                  "})();" +
                  "window._edOpenFallback = function(videoUrl) {" +
                  "  var videoPlayer = document.getElementById('videoPlayer');" +
                  "  if (!videoPlayer) return;" +
                  "  var parsed = (function(url){" +
                  "    var id='';" +
                  "    if (url.indexOf('youtu.be/') !== -1) id = url.split('youtu.be/')[1].split(/[?#]/)[0];" +
                  "    else if (url.indexOf('embed/') !== -1) id = url.split('embed/')[1].split(/[?#]/)[0];" +
                  "    else if (url.indexOf('v=') !== -1) id = url.split('v=')[1].split(/[&#]/)[0];" +
                  "    return { provider: 'youtube', id: id };" +
                  "  })(videoUrl);" +
                  "  if (window._edActivePlayer && typeof window._edActivePlayer.destroy === 'function') {" +
                  "    window._edActivePlayer.destroy();" +
                  "  }" +
                  "  var parent = videoPlayer.parentElement;" +
                  "  parent.innerHTML = '<div id=\"videoPlayer\" data-plyr-provider=\"youtube\" data-plyr-embed-id=\"' + parsed.id + '\"></div>';" +
                  "  window._edActivePlayer = new Plyr('#videoPlayer', {" +
                  "    youtube: { noCookie: true, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1 }," +
                  "    controls: ['play-large','play','progress','current-time','duration','mute','volume','fullscreen']" +
                  "  });" +
                  "};" +
                  "window.edallDesktop = {" +
                  "  isDesktop: true," +
                  "  getYoutubeFormats: function(url, cb) {" +
                  "    var cbName = '_ed_cb_' + Date.now() + '_' + Math.floor(Math.random()*1000);" +
                  "    window[cbName] = function(err, data) {" +
                  "      delete window[cbName];" +
                  "      if (err) {" +
                  "        window._edOpenFallback(url);" +
                  "      } else if (cb) {" +
                  "        cb(err, data);" +
                  "      }" +
                  "    };" +
                  "    window.AndroidNative.getYoutubeFormats(url, cbName);" +
                  "  }," +
                  "  setVideoFullscreen: function(fs) {" +
                  "    window.AndroidNative.setVideoFullscreen(fs);" +
                  "  }" +
                  "};";

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);

                  try {
                      NewPipe.init(OkHttpDownloader.getInstance(), Localization.DEFAULT, ContentCountry.DEFAULT);
                  } catch (Exception ignored) {}

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);

                  webView.clearCache(true);
                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidNative");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.toLowerCase().endsWith(".pdf") || url.contains(".pdf?") ||
                              (!url.contains("edall.lovable.app") && !url.contains("lovable.app") && !url.contains("localhost"))) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {}
                          }
                          return false;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              view.loadDataWithBaseURL(null, OFFLINE_HTML, "text/html", "UTF-8", null);
                          }
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              public WebView getWebView() {
                  return webView;
              }

              public void toggleFullscreen(boolean fullscreen) {
                  if (fullscreen) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                      );
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > android-project/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build Release APK with Gradle
        run: |
          cd android-project
          chmod +x ../gradlew 2>/dev/null || true
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign & Align Release APK
        run: |
          set -e
          cd android-project

          KEYSTORE_FILE="/tmp/release.keystore"
          KEY_ALIAS="edall"
          KEY_PASSWORD="edall_secure_key_2026"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=ED ALL, OU=Education, O=ED ALL Platform, L=Cairo, ST=Cairo, C=EG"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          fi

          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/34.0.0"
          "$BUILD_TOOLS_PATH/zipalign" -v -p 4 "$UNSIGNED_APK" /tmp/aligned.apk

          "$BUILD_TOOLS_PATH/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEY_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../EdAll.apk \
            /tmp/aligned.apk

          "$BUILD_TOOLS_PATH/apksigner" verify -v ../EdAll.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-APK-Release
          path: EdAll.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v3.1.0"
          name: "ED ALL Mobile Platform v3.1.0"
          draft: false
          prerelease: false
          files: EdAll.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
