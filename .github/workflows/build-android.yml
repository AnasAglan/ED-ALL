          base64 --decode "$RUNNER_TEMP/edall-icon.b64" > "$RUNNER_TEMP/edall-icon.png"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math
          import os

          root = Path("android-project/app/src/main/res")
          source = Image.open(Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "edall-icon.png").convert("RGBA")

          # Legacy launchers use density-specific square PNGs.
          for size, folder in [(48, "mipmap-mdpi"), (72, "mipmap-hdpi"), (96, "mipmap-xhdpi"), (144, "mipmap-xxhdpi"), (192, "mipmap-xxxhdpi")]:
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(root / folder / "ic_launcher.png", optimize=True)
              icon.save(root / folder / "ic_launcher_round.png", optimize=True)

          # Adaptive-icon foreground: transparent outside the badge, with its
          # circle kept within Android's launcher safe area. The black background
          # resource preserves the original icon's black corners.
          w, h = source.size
          center_x, center_y = (w - 1) / 2, (h - 1) / 2
          radius = min(w, h) * 0.498
          px = source.load()
          for y in range(h):
              for x in range(w):
                  if math.hypot(x - center_x, y - center_y) > radius:
                      px[x, y] = (0, 0, 0, 0)
          foreground_size = 432
          badge_size = 288
          badge = source.resize((badge_size, badge_size), Image.Resampling.LANCZOS)
          foreground = Image.new("RGBA", (foreground_size, foreground_size), (0, 0, 0, 0))
          foreground.alpha_composite(badge, ((foreground_size - badge_size) // 2, (foreground_size - badge_size) // 2))
          foreground.save(root / "drawable-nodpi" / "ic_launcher_foreground.png", optimize=True)

          (root / "mipmap-anydpi-v26" / "ic_launcher.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ''', encoding="utf-8")
          (root / "mipmap-anydpi-v26" / "ic_launcher_round.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          ''', encoding="utf-8")
          print("ED ALL launcher icons generated from the supplied artwork.")
          PY

      - name: Verify Gradle Version
        run: gradle --version

      - name: Build Release APK with Gradle
        run: |
          cd android-project
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace --info

      - name: Sign, align, and verify Release APK
        env:
          EDALL_KEYSTORE_BASE64: ${{ secrets.EDALL_KEYSTORE_BASE64 }}
          EDALL_KEYSTORE_PASSWORD: ${{ secrets.EDALL_KEYSTORE_PASSWORD }}
          EDALL_KEY_PASSWORD: ${{ secrets.EDALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android-project

          if [ -z "${EDALL_KEYSTORE_BASE64:-}" ] || [ -z "${EDALL_KEYSTORE_PASSWORD:-}" ] || [ -z "${EDALL_KEY_PASSWORD:-}" ]; then
            echo "ERROR: signing secrets are missing. Add EDALL_KEYSTORE_BASE64, EDALL_KEYSTORE_PASSWORD, and EDALL_KEY_PASSWORD in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/edall-release.p12"
          printf '%s' "$EDALL_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -storetype PKCS12 -keystore "$KEYSTORE_PATH" \
            -storepass "$EDALL_KEYSTORE_PASSWORD" -alias edall >/dev/null

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find app/build/outputs/apk/release/ -type f -name '*.apk' | head -n 1)"
          fi
          if [ -z "${UNSIGNED_APK:-}" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "ERROR: Gradle did not create a release APK."
            exit 1
          fi

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/edall-aligned.apk"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias edall \
            --ks-pass "env:EDALL_KEYSTORE_PASSWORD" \
            --key-pass "env:EDALL_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../EdAll.apk "$RUNNER_TEMP/edall-aligned.apk"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs ../EdAll.apk
          "$BUILD_TOOLS_DIR/aapt" dump badging ../EdAll.apk | grep -F "package: name='app.lovable.edall'"
          test -s ../EdAll.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-Android-APK
          path: EdAll.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (optional)
        if: startsWith(github.ref, 'refs/heads/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: Education
          RELEASE_TITLE: ED ALL Mobile Platform
        run: |
          set -euo pipefail
          test -f EdAll.apk

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' exists; replacing APK asset."
            if ! gh release upload "$RELEASE_TAG" EdAll.apk --clobber --repo "$GITHUB_REPOSITORY"; then
              echo "::warning title=Release publishing failed::The APK build and artifact upload succeeded, but GitHub Release upload failed. Check Settings > Actions > General > Workflow permissions and select Read and write permissions."
            fi
          else
            echo "Release '$RELEASE_TAG' does not exist; creating it."
            if ! gh release create "$RELEASE_TAG" EdAll.apk \
              --title "$RELEASE_TITLE" \
              --notes "Automated ED ALL Android APK build." \
              --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY"; then
              echo "::warning title=Release publishing failed::The APK build and artifact upload succeeded, but GitHub Release creation failed. Check Settings > Actions > General > Workflow permissions and select Read and write permissions."
            fi
          fi
