name: Build Android APK (ED ALL)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: edall-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Scaffold Complete Android Project
        run: |
          set -e
          mkdir -p android-project/app/src/main/java/com/edall/platform
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/gradle/wrapper

          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "ED ALL"
          include ':app'
          EOF

          cat << 'EOF' > android-project/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.edall.platform'
              compileSdk 34

              defaultConfig {
                  applicationId "com.edall.platform"
                  minSdk 24
                  targetSdk 34
                  versionCode 100003
                  versionName "3.1.0"

                  vectorDrawables.useSupportLibrary = true
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
          }
          EOF

          touch android-project/app/proguard-rules.pro

          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ED ALL</string>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/colors.xml
          <resources>
              <color name="primary">#020617</color>
              <color name="black">#000000</color>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0ea5e9"
                  android:pathData="M30,30h48v48h-48z"/>
              <path
                  android:fillColor="#ffffff"
                  android:pathData="M38,44h32v6h-32zM38,54h24v6h-24z"/>
          </vector>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmhlAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABoSURBVHhe7cEBDQAAAMKg909tDwcUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA4Ddt0gABb84yfwAAAABJRU5ErkJggg==
          EOF
          base64 -d android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png > android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png.tmp
          mv android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png.tmp android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          curl -sSL "https://edall.lovable.app/__l5e/assets-v1/71bdb918-9fe9-4771-a708-5fa36185f009/edall.png" -o android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
