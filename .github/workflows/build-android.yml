name: Build EdAll Android App (APK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Android Native Project
        run: |
          mkdir -p app/src/main/java/com/edall/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/drawable

          # 1. تحميل أيقونة المنصة الرسمية
          curl -sL "https://edall.lovable.app/__l5e/assets-v1/71bdb918-9fe9-4771-a708-5fa36185f009/edall.png" -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          # 2. إعدادات Gradle العامة (gradle.properties)
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 3. إعدادات المشروع والمستودعات (settings.gradle)
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "EdAll"
          include ':app'
          EOF

          # 4. ملف البناء الرئيسي (build.gradle) - تم إصلاح المستودعات هنا
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }

          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 5. ملف بناء التطبيق (app/build.gradle)
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.edall.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.edall.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += [
                          'META-INF/DEPENDENCIES',
                          'META-INF/LICENSE',
                          'META-INF/LICENSE.txt',
                          'META-INF/license.txt',
                          'META-INF/NOTICE',
                          'META-INF/NOTICE.txt',
                          'META-INF/notice.txt',
                          'META-INF/INDEX.LIST',
                          'META-INF/INDEX.list'
                      ]
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
          }
          EOF

          # 6. ملف البيان والأذونات (AndroidManifest.xml)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="EdAll"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. الثيم والألوان (res/values/styles.xml & strings.xml)
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">#0F172A</item>
                  <item name="android:statusBarColor">#0F172A</item>
                  <item name="android:navigationBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">EdAll</string>
          </resources>
          EOF

          # 8. محرك تحميل NewPipe (OkHttpDownloader.java)
          cat << 'EOF' > app/src/main/java/com/edall/app/OkHttpDownloader.java
          package com.edall.app;

          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException;

          import java.io.IOException;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.TimeUnit;

          import okhttp3.Headers;
          import okhttp3.OkHttpClient;
          import okhttp3.RequestBody;
          import okhttp3.ResponseBody;

          public class OkHttpDownloader extends Downloader {
              private final OkHttpClient client;

              public OkHttpDownloader() {
                  this.client = new OkHttpClient.Builder()
                          .connectTimeout(30, TimeUnit.SECONDS)
                          .readTimeout(30, TimeUnit.SECONDS)
                          .build();
              }

              @Override
              public Response execute(Request request) throws IOException, ReCaptchaException {
                  String httpMethod = request.httpMethod();
                  String url = request.url();
                  Headers.Builder headersBuilder = new Headers.Builder();
                  if (request.headers() != null) {
                      for (Map.Entry<String, List<String>> entry : request.headers().entrySet()) {
                          for (String val : entry.getValue()) {
                              headersBuilder.add(entry.getKey(), val);
                          }
                      }
                  }

                  RequestBody body = null;
                  if (request.dataToSend() != null) {
                      body = RequestBody.create(request.dataToSend(), null);
                  }

                  okhttp3.Request.Builder okReq = new okhttp3.Request.Builder()
                          .url(url)
                          .headers(headersBuilder.build())
                          .method(httpMethod, body);

                  try (okhttp3.Response response = client.newCall(okReq.build()).execute()) {
                      if (response.code() == 429) {
                          throw new ReCaptchaException("reCAPTCHA requested", url);
                      }
                      ResponseBody resBody = response.body();
                      String responseBodyText = resBody != null ? resBody.string() : "";
                      Map<String, List<String>> resHeaders = new HashMap<>(response.headers().toMultimap());
                      return new Response(response.code(), response.message(), resHeaders, responseBodyText, response.request().url().toString());
                  }
              }
          }
          EOF

          # 9. شاشة التطبيق الرئيسية (MainActivity.java) مع حماية الشاشة واستخراج الجودات
          cat << 'EOF' > app/src/main/java/com/edall/app/MainActivity.java
          package com.edall.app;

          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.ServiceList;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.StreamInfo;
          import org.schabi.newpipe.extractor.stream.VideoStream;

          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.concurrent.Callable;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private final ExecutorService executor = Executors.newCachedThreadPool();

              private static final String JS_SHIM =
                  "(function() {" +
                  "  if (window.edallDesktop) return;" +
                  "  window.edallAndroidApp = true;" +
                  "  window.edallDesktop = {" +
                  "    isDesktop: true," +
                  "    isAndroid: true," +
                  "    version: '2.0.0-android'," +
                  "    getYoutubeFormats: function(videoId) {" +
                  "      return new Promise(function(resolve, reject) {" +
                  "        try {" +
                  "          var raw = window.edallAndroid.getFormatsSync(videoId);" +
                  "          if (!raw) { reject(new Error('Extraction failed')); return; }" +
                  "          var parsed = JSON.parse(raw);" +
                  "          if (parsed && parsed.error) { reject(new Error(parsed.error)); return; }" +
                  "          resolve(parsed);" +
                  "        } catch (e) { reject(e); }" +
                  "      });" +
                  "    }," +
                  "    setVideoFullscreen: function(enabled) {" +
                  "      window.edallAndroid.setFullscreen(enabled === true);" +
                  "    }" +
                  "  };" +
                  "})();";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // منع تصوير الشاشة وتسجيل الفيديو
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);

                  // تهيئة محرك NewPipe
                  try {
                      NewPipe.init(new OkHttpDownloader());
                  } catch (Exception ignored) {}

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  ws.setUserAgentString(ws.getUserAgentString() + " EdAllAndroid/1.0 EdAllAndroidApp/2.0");

                  webView.addJavascriptInterface(new WebAppInterface(), "edallAndroid");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          view.evaluateJavascript(JS_SHIM, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript(JS_SHIM, null);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("https://edall.lovable.app/ed_master.html");
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public boolean isApp() { return true; }

                  @JavascriptInterface
                  public boolean isAndroid() { return true; }

                  @JavascriptInterface
                  public String getFormatsSync(String videoId) {
                      Future<String> future = executor.submit(new Callable<String>() {
                          @Override
                          public String call() {
                              try {
                                  String watchUrl = "https://www.youtube.com/watch?v=" + videoId;
                                  StreamInfo info = StreamInfo.getInfo(ServiceList.YouTube, watchUrl);

                                  JSONObject result = new JSONObject();
                                  result.put("title", info.getName());

                                  String audioUrl = null;
                                  List<AudioStream> audioStreams = info.getAudioStreams();
                                  if (audioStreams != null && !audioStreams.isEmpty()) {
                                      audioUrl = audioStreams.get(0).getContent();
                                  }
                                  result.put("audioUrl", audioUrl != null ? audioUrl : JSONObject.NULL);

                                  JSONArray formats = new JSONArray();
                                  List<VideoStream> videos = info.getVideoStreams();
                                  if (videos != null) {
                                      for (VideoStream v : videos) {
                                          JSONObject item = new JSONObject();
                                          item.put("quality", v.getResolution());
                                          item.put("height", v.getHeight());
                                          item.put("format_note", v.getResolution());
                                          item.put("has_audio", !v.isVideoOnly());
                                          item.put("url", v.getContent());
                                          formats.put(item);
                                      }
                                  }

                                  List<VideoStream> videoOnly = info.getVideoOnlyStreams();
                                  if (videoOnly != null) {
                                      for (VideoStream v : videoOnly) {
                                          JSONObject item = new JSONObject();
                                          item.put("quality", v.getResolution());
                                          item.put("height", v.getHeight());
                                          item.put("format_note", v.getResolution() + " (Adaptive)");
                                          item.put("has_audio", false);
                                          item.put("url", v.getContent());
                                          formats.put(item);
                                      }
                                  }

                                  result.put("formats", formats);
                                  return result.toString();
                              } catch (Exception e) {
                                  return "{\"error\":\"" + e.getMessage() + "\"}";
                              }
                          }
                      });

                      try {
                          return future.get();
                      } catch (Exception e) {
                          return "{\"error\":\"Extraction timeout\"}";
                      }
                  }

                  @JavascriptInterface
                  public void setFullscreen(final boolean enabled) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (enabled) {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                                  getWindow().getDecorView().setSystemUiVisibility(
                                      View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  );
                              } else {
                                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                              }
                          }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Signed Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Package APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/EdAll.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-Android-APK
          path: output/EdAll.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: Education
          files: output/EdAll.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
