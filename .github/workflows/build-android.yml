name: Build & Sign Release APK (ED ALL)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: edall-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_API_LEVEL: '34'
      ANDROID_BUILD_TOOLS: '34.0.0'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.6'

      - name: Scaffold Android Project
        run: |
          set -e
          mkdir -p android-project/app/src/main/java/app/lovable/edall
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/gradle/wrapper

          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # settings.gradle المركزي يحدد المستودعات بالكامل لمنع أي تعارض
          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = 'ED ALL'
          include ':app'
          EOF

          # Pin the Android Gradle Plugin version explicitly.
          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }

          tasks.register('clean', Delete) {
              delete rootProject.layout.buildDirectory
          }
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          def ciRunNum = System.getenv("GITHUB_RUN_NUMBER") ?: "1"
          def ciVersionCode = 100000 + ciRunNum.toInteger()

          android {
              namespace 'app.lovable.edall'
              compileSdk 34

              defaultConfig {
                  applicationId "app.lovable.edall"
                  minSdk 24
                  targetSdk 34
                  versionCode ciVersionCode
                  versionName "3.2.${ciRunNum}"

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
          }
          EOF

          cat << 'EOF' > android-project/app/proguard-rules.pro
          # ED ALL app-specific ProGuard rules.
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ED ALL</string>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="primary">#1E293B</color>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.EDALL" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@color/primary</item>
                  <item name="android:statusBarColor">@color/primary</item>
                  <item name="android:navigationBarColor">@color/primary</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/Theme.EDALL">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # OkHttpDownloader للتعامل الآمن مع يوتيوب بدون أخطاء POST
          cat << 'EOF' > android-project/app/src/main/java/app/lovable/edall/OkHttpDownloader.java
          package app.lovable.edall;

          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException;

          import java.io.IOException;
          import java.util.*;
          import java.util.concurrent.TimeUnit;

          import okhttp3.*;

          public class OkHttpDownloader extends Downloader {
              private static OkHttpDownloader instance;
              private final OkHttpClient client;

              private OkHttpDownloader() {
                  this.client = new OkHttpClient.Builder()
                      .connectTimeout(25, TimeUnit.SECONDS)
                      .readTimeout(30, TimeUnit.SECONDS)
                      .followRedirects(true)
                      .followSslRedirects(true)
                      .cookieJar(new CookieJar() {
                          private final HashMap<String, List<Cookie>> cookieStore = new HashMap<>();
                          @Override
                          public void saveFromResponse(HttpUrl url, List<Cookie> cookies) {
                              cookieStore.put(url.host(), cookies);
                          }
                          @Override
                          public List<Cookie> loadForRequest(HttpUrl url) {
                              List<Cookie> cookies = cookieStore.get(url.host());
                              return cookies != null ? cookies : new ArrayList<>();
                          }
                      })
                      .build();
              }

              public static synchronized OkHttpDownloader getInstance() {
                  if (instance == null) instance = new OkHttpDownloader();
                  return instance;
              }

              @Override
              public Response execute(Request request) throws IOException, ReCaptchaException {
                  String httpMethod = request.httpMethod();
                  String url = request.url();
                  Headers.Builder headersBuilder = new Headers.Builder();

                  headersBuilder.set("User-Agent", "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36");
                  headersBuilder.set("Accept-Language", "ar,en-US;q=0.9,en;q=0.8");

                  Map<String, List<String>> reqHeaders = request.headers();
                  if (reqHeaders != null) {
                      for (Map.Entry<String, List<String>> entry : reqHeaders.entrySet()) {
                          for (String v : entry.getValue()) {
                              headersBuilder.add(entry.getKey(), v);
                          }
                      }
                  }

                  RequestBody requestBody = null;
                  byte[] dataToSend = request.dataToSend();
                  if ("POST".equalsIgnoreCase(httpMethod) || "PUT".equalsIgnoreCase(httpMethod)) {
                      requestBody = RequestBody.create(dataToSend != null ? dataToSend : new byte[0], MediaType.parse("application/json; charset=utf-8"));
                  }

                  okhttp3.Request.Builder okRequestBuilder = new okhttp3.Request.Builder()
                      .url(url)
                      .method(httpMethod, requestBody)
                      .headers(headersBuilder.build());

                  okhttp3.Response okResponse = client.newCall(okRequestBuilder.build()).execute();
                  int code = okResponse.code();

                  if (code == 429) {
                      okResponse.close();
                      throw new ReCaptchaException("YouTube rate limit / verification", url);
                  }

                  ResponseBody body = okResponse.body();
                  String responseBodyString = body != null ? body.string() : "";
                  String latestUrl = okResponse.request().url().toString();

                  Map<String, List<String>> resHeaders = new HashMap<>();
                  for (String name : okResponse.headers().names()) {
                      resHeaders.put(name, okResponse.headers(name));
                  }

                  return new Response(code, okResponse.message(), resHeaders, responseBodyString, latestUrl);
              }
          }
          EOF

          # WebAppInterface لربط الجودات مع المنصة
          cat << 'EOF' > android-project/app/src/main/java/app/lovable/edall/WebAppInterface.java
          package app.lovable.edall;

          import android.content.Context;
          import android.os.Handler;
          import android.os.Looper;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.ServiceList;
          import org.schabi.newpipe.extractor.services.youtube.extractors.YoutubeStreamExtractor;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.StreamInfo;
          import org.schabi.newpipe.extractor.stream.VideoStream;

          import java.util.*;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class WebAppInterface {
              private final Context context;
              private final WebView webView;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private final ExecutorService executor = Executors.newFixedThreadPool(3);
              private final Map<String, String> cache = new ConcurrentHashMap<>();

              public WebAppInterface(Context context, WebView webView) {
                  this.context = context;
                  this.webView = webView;
              }

              @JavascriptInterface
              public void fetchYoutubeFormats(final String videoId, final String callbackId) {
                  if (videoId == null || videoId.length() < 11) {
                      sendResult(callbackId, "{\"error\":\"Invalid Video ID\",\"fallback\":true}");
                      return;
                  }

                  if (cache.containsKey(videoId)) {
                      sendResult(callbackId, cache.get(videoId));
                      return;
                  }

                  executor.execute(() -> {
                      try {
                          YoutubeStreamExtractor extractor = (YoutubeStreamExtractor) ServiceList.YouTube.getStreamExtractor("https://www.youtube.com/watch?v=" + videoId);
                          extractor.fetchPage();

                          String title = extractor.getName();
                          List<VideoStream> videoStreams = extractor.getVideoStreams();
                          List<VideoStream> videoOnlyStreams = extractor.getVideoOnlyStreams();
                          List<AudioStream> audioStreams = extractor.getAudioStreams();

                          AudioStream bestAudio = null;
                          int maxAbr = -1;
                          for (AudioStream as : audioStreams) {
                              if (as.getAverageBitrate() > maxAbr) {
                                  maxAbr = as.getAverageBitrate();
                                  bestAudio = as;
                              }
                          }

                          Map<Integer, VideoStream> formatMap = new TreeMap<>(Collections.reverseOrder());
                          for (VideoStream vs : videoStreams) {
                              int h = vs.getHeight();
                              if (h >= 144 && (!formatMap.containsKey(h) || vs.getBitrate() > formatMap.get(h).getBitrate())) {
                                  formatMap.put(h, vs);
                              }
                          }

                          if (bestAudio != null) {
                              for (VideoStream vs : videoOnlyStreams) {
                                  int h = vs.getHeight();
                                  if (h >= 144 && !formatMap.containsKey(h)) {
                                      formatMap.put(h, vs);
                                  }
                              }
                          }

                          if (formatMap.isEmpty()) {
                              sendResult(callbackId, "{\"error\":\"No playable streams\",\"fallback\":true}");
                              return;
                          }

                          JSONObject result = new JSONObject();
                          result.put("title", title != null ? title : "Video");
                          result.put("fallback", false);

                          if (bestAudio != null) {
                              JSONObject audioObj = new JSONObject();
                              audioObj.put("url", bestAudio.getUrl());
                              audioObj.put("expire", System.currentTimeMillis() + 3600000L);
                              result.put("audio", audioObj);
                          } else {
                              result.put("audio", JSONObject.NULL);
                          }

                          JSONArray videosArr = new JSONArray();
                          for (Map.Entry<Integer, VideoStream> entry : formatMap.entrySet()) {
                              VideoStream vs = entry.getValue();
                              JSONObject vObj = new JSONObject();
                              vObj.put("h", entry.getKey());
                              vObj.put("url", vs.getUrl());
                              vObj.put("hasAudio", vs.isVideoOnly() ? false : true);
                              vObj.put("expire", System.currentTimeMillis() + 3600000L);
                              videosArr.put(vObj);
                          }
                          result.put("videos", videosArr);

                          String jsonString = result.toString();
                          cache.put(videoId, jsonString);
                          sendResult(callbackId, jsonString);

                      } catch (Exception e) {
                          sendResult(callbackId, "{\"error\":\"" + e.getMessage() + "\",\"fallback\":true}");
                      }
                  });
              }

              private void sendResult(final String callbackId, final String jsonResult) {
                  mainHandler.post(() -> {
                      String safeJson = jsonResult.replace("'", "\\'");
                      webView.evaluateJavascript("window.__edResolveFormat && window.__edResolveFormat('" + callbackId + "', '" + safeJson + "');", null);
                  });
              }
          }
          EOF

          # MainActivity تدعم شاشة انقطاع النت وفتح PDF في المتصفح وتفريغ الكاش
          cat << 'EOF' > android-project/app/src/main/java/app/lovable/edall/MainActivity.java
          package app.lovable.edall;

          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.*;
          import android.widget.FrameLayout;
          import androidx.appcompat.app.AppCompatActivity;

          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.localization.ContentCountry;
          import org.schabi.newpipe.extractor.localization.Localization;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private FrameLayout customViewContainer;
              private WebChromeClient.CustomViewCallback customViewCallback;
              private View customView;
              private static final String PLATFORM_URL = "https://edall.lovable.app/ed_master.html";

              private static final String JS_BRIDGE_SHIM =
                  "(function() {" +
                  "  if (window.__edallAndroidBridgeInjected) return;" +
                  "  window.__edallAndroidBridgeInjected = true;" +
                  "  window.__edCallbacks = {};" +
                  "  window.__edResolveFormat = function(id, raw) {" +
                  "    if (window.__edCallbacks[id]) {" +
                  "      try { window.__edCallbacks[id](JSON.parse(raw)); } catch(e) { window.__edCallbacks[id]({ fallback: true }); }" +
                  "      delete window.__edCallbacks[id];" +
                  "    }" +
                  "  };" +
                  "  window.edallDesktop = {" +
                  "    isDesktop: true," +
                  "    isAndroid: true," +
                  "    version: '3.2.0'," +
                  "    getYoutubeFormats: function(videoId, force) {" +
                  "      return new Promise(function(resolve) {" +
                  "        var cbId = 'cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);" +
                  "        window.__edCallbacks[cbId] = function(res) {" +
                  "          if (!res || res.error || res.fallback || !res.videos || !res.videos.length) {" +
                  "            resolve({ fallback: true, error: res ? res.error : 'Format extraction failed' });" +
                  "          } else {" +
                  "            resolve(res);" +
                  "          }" +
                  "        };" +
                  "        if (window.AndroidBridge && window.AndroidBridge.fetchYoutubeFormats) {" +
                  "          window.AndroidBridge.fetchYoutubeFormats(videoId, cbId);" +
                  "        } else {" +
                  "          resolve({ fallback: true });" +
                  "        }" +
                  "      });" +
                  "    }," +
                  "    setVideoFullscreen: function(enabled) { return Promise.resolve(true); }" +
                  "  };" +
                  "  var h = document.getElementById('desktopDownloadHero'); if(h) h.style.display = 'none';" +
                  "})();";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);

                  try {
                      NewPipe.init(OkHttpDownloader.getInstance(), Localization.DEFAULT, ContentCountry.DEFAULT);
                  } catch (Exception ignored) {}

                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  customViewContainer = new FrameLayout(this);
                  customViewContainer.setVisibility(View.GONE);

                  root.addView(webView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(customViewContainer, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

                  webView.clearCache(true);
                  webView.addJavascriptInterface(new WebAppInterface(this, webView), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (url.startsWith("https://edall.lovable.app")) {
                              if (url.toLowerCase().endsWith(".pdf") || url.contains("drive.google.com") || url.contains("4shared.com")) {
                                  try {
                                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                      startActivity(intent);
                                      return true;
                                  } catch (Exception ignored) {}
                              }
                              return false;
                          }
                          try {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                              return true;
                          } catch (Exception e) {
                              return true;
                          }
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              String offlineHtml = "<!doctype html><html lang='ar' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'>" +
                                  "<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#f2f2f2;font-family:sans-serif;text-align:center;padding:20px;box-sizing:border-box;}" +
                                  "button{display:inline-block;padding:14px 32px;border-radius:12px;background:#2f7cf6;color:#fff;border:none;font-weight:700;font-size:1.1rem;margin-top:20px;cursor:pointer;}</style></head>" +
                                  "<body><div><h2>تحقق من اتصالك بالإنترنت وأعد المحاولة</h2><p>Check your internet connection and retry.</p>" +
                                  "<button onclick='location.reload()'>إعادة المحاولة</button></div></body></html>";
                              view.loadDataWithBaseURL(null, offlineHtml, "text/html", "UTF-8", null);
                          }
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          customViewContainer.addView(view);
                          customViewContainer.setVisibility(View.VISIBLE);
                          webView.setVisibility(View.GONE);
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          customViewContainer.removeView(customView);
                          customViewContainer.setVisibility(View.GONE);
                          customView = null;
                          if (customViewCallback != null) customViewCallback.onCustomViewHidden();
                          webView.setVisibility(View.VISIBLE);
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                      }
                  });

                  webView.loadUrl(PLATFORM_URL);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) webView.clearCache(true);
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      WebChromeClient client = new WebChromeClient();
                      client.onHideCustomView();
                  } else if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for launcher icon generation
        run: python -m pip install --upgrade pip Pillow

      - name: Generate Solid Launcher Icons
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          for size, folder in [(48, 'mipmap-mdpi'), (72, 'mipmap-hdpi'), (96, 'mipmap-xhdpi'), (144, 'mipmap-xxhdpi')]:
              img = Image.new('RGBA', (size, size), (30, 41, 59, 255))
              draw = ImageDraw.Draw(img)
              margin = int(size * 0.15)
              draw.rounded_rectangle([margin, margin, size - margin, size - margin], radius=int(size * 0.2), fill=(47, 124, 246, 255))
              img.save(f'android-project/app/src/main/res/{folder}/ic_launcher.png')
          "

      - name: Verify Gradle Version
        run: gradle --version

      - name: Build Release APK with Gradle
        run: |
          cd android-project
          gradle --version
          gradle :app:assembleRelease --no-daemon --stacktrace --info

      - name: Sign & Align Release APK
        env:
          KEY_PASS: edall_secure_key_2026
        run: |
          set -e
          cd android-project
          KEYSTORE_PATH="/tmp/edall_fixed.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" \
            -alias edall -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
            -dname "CN=ED ALL, OU=Platform, O=ED ALL Education, L=Cairo, ST=Cairo, C=EG"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
              UNSIGNED_APK=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          fi

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          "${BUILD_TOOLS_DIR}/zipalign" -v -p 4 "$UNSIGNED_APK" /tmp/aligned.apk
          "${BUILD_TOOLS_DIR}/apksigner" sign --ks "$KEYSTORE_PATH" \
            --ks-key-alias edall \
            --ks-pass "pass:$KEY_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out ../EdAll.apk /tmp/aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-Android-APK
          path: EdAll.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: Education
          name: 'ED ALL Mobile Platform'
          draft: false
          prerelease: false
          files: EdAll.apk
