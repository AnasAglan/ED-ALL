name: Build EdAll Android App (APK)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Protected Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Create Native Android Project Structure
        run: |
          mkdir -p android-app/app/src/main/java/com/edall/app
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/assets

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b682449e00fe1e4d7521a6e0f70794\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a2b8e388d7352642d3c32124ee7\n" > "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Download App Assets & Web Snapshot
        run: |
          # تنزيل أحدث نسخة من كود المنصة للعمل أوفلاين
          curl -sSL "https://edall.lovable.app/ed_master.html" -o android-app/app/src/main/assets/platform.html
          
          # تنزيل الأيقونة وتوزيعها على كافة مقاسات الشاشات
          curl -sSL "https://edall.lovable.app/__l5e/assets-v1/71bdb918-9fe9-4771-a708-5fa36185f009/edall.png" -o android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-xhdpi/
          cp android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-hdpi/
          cp android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android-app/app/src/main/res/mipmap-mdpi/

      - name: Write Android Manifest
        run: |
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.edall.app">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="ED ALL"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write Layout and Theme
        run: |
          cat << 'EOF' > android-app/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0b0f19">

              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <FrameLayout
                  android:id="@+id/fullscreenContainer"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:visibility="gone" />
          </RelativeLayout>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowBackground">#0b0f19</item>
              </style>
          </resources>
          EOF

      - name: Write MainActivity with Screen Protection & Fullscreen
        run: |
          cat << 'EOF' > android-app/app/src/main/java/com/edall/app/MainActivity.java
          package com.edall.app;

          import android.annotation.SuppressLint;
          import android.content.pm.ActivityInfo;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private FrameLayout fullscreenContainer;
              private View customView;
              private WebChromeClient.CustomViewCallback customViewCallback;

              public static class WebAppInterface {
                  @JavascriptInterface
                  public boolean isApp() {
                      return true;
                  }

                  @JavascriptInterface
                  public boolean isAndroid() {
                      return true;
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // منع السكرين شوت وتسجيل الفيديو للشاشة
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_SECURE,
                      WindowManager.LayoutParams.FLAG_SECURE
                  );

                  setContentView(R.layout.activity_main);

                  webView = findViewById(R.id.webView);
                  fullscreenContainer = findViewById(R.id.fullscreenContainer);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUserAgentString(settings.getUserAgentString() + " EdAllAndroid/1.0 EdAllAndroidApp/2.0");

                  // تمكين واجهة الجافاسكريبت للتعرف على التطبيق وإخفاء أزرار التحميل
                  webView.addJavascriptInterface(new WebAppInterface(), "edallAndroid");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return false;
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              view.loadUrl("file:///android_asset/platform.html");
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customViewCallback = callback;
                          fullscreenContainer.addView(view, new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          webView.setVisibility(View.GONE);

                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_FULLSCREEN |
                              View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          );
                      }

                      @Override
                      public void onHideCustomView() {
                          if (customView == null) return;
                          fullscreenContainer.removeView(customView);
                          customView = null;
                          fullscreenContainer.setVisibility(View.GONE);
                          webView.setVisibility(View.VISIBLE);
                          if (customViewCallback != null) {
                              customViewCallback.onCustomViewHidden();
                          }
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                      }
                  });

                  webView.loadUrl("https://edall.lovable.app/ed_master.html");
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      if (webView.getWebChromeClient() != null) {
                          ((WebChromeClient) webView.getWebChromeClient()).onHideCustomView();
                      }
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Write Gradle Configuration & Properties
        run: |
          cat << 'EOF' > android-app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EdAll"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.edall.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.edall.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "2.0"
              }

              signingConfigs {
                  release {
                      storeFile file("keystore.jks")
                      storePassword "edall12345"
                      keyAlias "edallkey"
                      keyPassword "edall12345"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Generate Official Signing Keystore
        run: |
          keytool -genkey -v \
            -keystore android-app/app/keystore.jks \
            -alias edallkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass edall12345 \
            -keypass edall12345 \
            -dname "CN=EdAll, OU=Platform, O=EdAll, L=Cairo, S=Cairo, C=EG"

      - name: Build Signed Release APK
        run: |
          cd android-app
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../EdAll.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: Education
          files: EdAll.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
