name: Build EdAll Android App (APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android.yml'

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  JAVA_VERSION: '17'
  RELEASE_TAG: 'Education'

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Scaffold Android project structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-project/app/src/main/java/com/edall/app
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/gradle/wrapper

          # 1. settings.gradle
          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "EdAll"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.edall.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.edall.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 100000 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "3.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST']
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
          }
          EOF

          # 5. OkHttp Downloader with Cookie Support & POST Fix
          cat << 'EOF' > android-project/app/src/main/java/com/edall/app/OkHttpDownloader.java
          package com.edall.app;

          import androidx.annotation.NonNull;
          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException;

          import java.io.IOException;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.TimeUnit;

          import okhttp3.Cookie;
          import okhttp3.CookieJar;
          import okhttp3.Headers;
          import okhttp3.HttpUrl;
          import okhttp3.OkHttpClient;
          import okhttp3.RequestBody;
          import okhttp3.ResponseBody;

          public class OkHttpDownloader extends Downloader {
              private static final String DEFAULT_USER_AGENT =
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36";

              private final OkHttpClient client;
              private final Map<String, List<Cookie>> cookieStore = new ConcurrentHashMap<>();

              public OkHttpDownloader() {
                  this.client = new OkHttpClient.Builder()
                          .cookieJar(new CookieJar() {
                              @Override
                              public void saveFromResponse(@NonNull HttpUrl url, @NonNull List<Cookie> cookies) {
                                  cookieStore.put(url.host(), cookies);
                              }
                              @NonNull
                              @Override
                              public List<Cookie> loadForRequest(@NonNull HttpUrl url) {
                                  List<Cookie> cookies = cookieStore.get(url.host());
                                  return cookies != null ? cookies : Collections.emptyList();
                              }
                          })
                          .connectTimeout(25, TimeUnit.SECONDS)
                          .readTimeout(30, TimeUnit.SECONDS)
                          .followRedirects(true)
                          .followSslRedirects(true)
                          .build();
              }

              @Override
              public Response execute(Request request) throws IOException, ReCaptchaException {
                  String method = request.httpMethod();
                  String url = request.url();
                  byte[] dataToSend = request.dataToSend();

                  RequestBody requestBody = null;
                  if ("POST".equalsIgnoreCase(method)) {
                      requestBody = RequestBody.create(dataToSend != null ? dataToSend : new byte[0], null);
                  } else if (dataToSend != null) {
                      requestBody = RequestBody.create(dataToSend, null);
                  }

                  okhttp3.Request.Builder builder = new okhttp3.Request.Builder()
                          .method(method, requestBody)
                          .url(url)
                          .addHeader("User-Agent", DEFAULT_USER_AGENT)
                          .addHeader("Accept-Language", "en-US,en;q=0.9");

                  for (Map.Entry<String, List<String>> pair : request.headers().entrySet()) {
                      builder.removeHeader(pair.getKey());
                      for (String val : pair.getValue()) {
                          builder.addHeader(pair.getKey(), val);
                      }
                  }

                  okhttp3.Response response = client.newCall(builder.build()).execute();
                  if (response.code() == 429) {
                      response.close();
                      throw new ReCaptchaException("reCaptcha required", url);
                  }

                  ResponseBody body = response.body();
                  String responseBodyText = body != null ? body.string() : "";
                  Headers headers = response.headers();
                  Map<String, List<String>> responseHeaders = new HashMap<>(headers.toMultimap());

                  return new Response(
                          response.code(),
                          response.message(),
                          responseHeaders,
                          responseBodyText,
                          response.request().url().toString()
                  );
              }
          }
          EOF

          # 6. WebAppInterface with Robust Extraction
          cat << 'EOF' > android-project/app/src/main/java/com/edall/app/WebAppInterface.java
          package com.edall.app;

          import android.webkit.JavascriptInterface;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.StreamingService;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.StreamInfo;
          import org.schabi.newpipe.extractor.stream.VideoStream;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public class WebAppInterface {
              private final MainActivity activity;

              public WebAppInterface(MainActivity activity) {
                  this.activity = activity;
              }

              @JavascriptInterface
              public boolean isApp() { return true; }

              @JavascriptInterface
              public boolean isAndroid() { return true; }

              @JavascriptInterface
              public void setFullscreen(boolean enabled) {
                  activity.runOnUiThread(() -> activity.setDesktopFullscreen(enabled));
              }

              @JavascriptInterface
              public String extractFormats(String videoId) {
                  try {
                      String watchUrl = "https://www.youtube.com/watch?v=" + videoId;
                      StreamingService service = NewPipe.getServiceByUrl(watchUrl);
                      StreamInfo info = StreamInfo.getInfo(service, watchUrl);

                      Map<Integer, VideoStream> bestByHeight = new HashMap<>();

                      // 1. Check progressive streams (video + audio)
                      if (info.getVideoStreams() != null) {
                          for (VideoStream vs : info.getVideoStreams()) {
                              int h = vs.getHeight();
                              String url = vs.getContent();
                              if (h <= 0 || url == null || !url.startsWith("http")) continue;
                              if (!bestByHeight.containsKey(h) || (vs.getBitrate() > bestByHeight.get(h).getBitrate())) {
                                  bestByHeight.put(h, vs);
                              }
                          }
                      }

                      // 2. Check video-only streams (1080p, 720p, 480p)
                      if (info.getVideoOnlyStreams() != null) {
                          for (VideoStream vs : info.getVideoOnlyStreams()) {
                              int h = vs.getHeight();
                              String url = vs.getContent();
                              if (h <= 0 || url == null || !url.startsWith("http")) continue;
                              if (!bestByHeight.containsKey(h) || (vs.getBitrate() > bestByHeight.get(h).getBitrate())) {
                                  bestByHeight.put(h, vs);
                              }
                          }
                      }

                      List<VideoStream> sortedVideos = new ArrayList<>(bestByHeight.values());
                      Collections.sort(sortedVideos, (a, b) -> Integer.compare(b.getHeight(), a.getHeight()));

                      AudioStream bestAudio = null;
                      if (info.getAudioStreams() != null) {
                          for (AudioStream as : info.getAudioStreams()) {
                              String url = as.getContent();
                              if (url == null || !url.startsWith("http")) continue;
                              if (bestAudio == null || as.getAverageBitrate() > bestAudio.getAverageBitrate()) {
                                  bestAudio = as;
                              }
                          }
                      }

                      if (sortedVideos.isEmpty()) {
                          JSONObject err = new JSONObject();
                          err.put("error", "No playable streams found for this video");
                          return err.toString();
                      }

                      JSONObject root = new JSONObject();
                      root.put("title", info.getName() != null ? info.getName() : "Video");
                      root.put("expiresAt", System.currentTimeMillis() + 6 * 3600 * 1000);

                      JSONArray videosArr = new JSONArray();
                      for (VideoStream vs : sortedVideos) {
                          JSONObject vObj = new JSONObject();
                          vObj.put("h", vs.getHeight());
                          vObj.put("url", vs.getContent());
                          vObj.put("hasAudio", !vs.isVideoOnly());
                          videosArr.put(vObj);
                      }
                      root.put("videos", videosArr);

                      if (bestAudio != null) {
                          JSONObject aObj = new JSONObject();
                          aObj.put("url", bestAudio.getContent());
                          root.put("audio", aObj);
                      }

                      return root.toString();
                  } catch (Exception e) {
                      e.printStackTrace();
                      try {
                          JSONObject err = new JSONObject();
                          err.put("error", e.getMessage() != null ? e.getMessage() : e.getClass().getSimpleName());
                          return err.toString();
                      } catch (Exception ignored) {
                          return "{\"error\":\"Extraction failed\"}";
                      }
                  }
              }
          }
          EOF

          # 7. MainActivity
          cat << 'EOF' > android-project/app/src/main/java/com/edall/app/MainActivity.java
          package com.edall.app;

          import android.annotation.SuppressLint;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.localization.ContentCountry;
          import org.schabi.newpipe.extractor.localization.Localization;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final String PLATFORM_URL = "https://edall.lovable.app/ed_master.html";

              private static final String JS_BRIDGE_SHIM =
                  "(function() {" +
                  "  if (window._edallDesktopInjected) return;" +
                  "  window._edallDesktopInjected = true;" +
                  "  window.edallAndroid = {" +
                  "    isApp: function() { return true; }," +
                  "    isAndroid: function() { return true; }" +
                  "  };" +
                  "  window.edallDesktop = {" +
                  "    isDesktop: true," +
                  "    isAndroid: true," +
                  "    version: '3.0.0'," +
                  "    getYoutubeFormats: function(vid, force) {" +
                  "      return new Promise(function(resolve, reject) {" +
                  "        setTimeout(function() {" +
                  "          try {" +
                  "            var res = window.edallNative.extractFormats(vid);" +
                  "            if (!res) { reject(new Error('No response from native extractor')); return; }" +
                  "            var data = JSON.parse(res);" +
                  "            if (data.error) { reject(new Error(data.error)); return; }" +
                  "            if (data.videos && data.videos.length > 0) { resolve(data); }" +
                  "            else { reject(new Error('No playable video streams')); }" +
                  "          } catch(err) { reject(err); }" +
                  "        }, 10);" +
                  "      });" +
                  "    }," +
                  "    setVideoFullscreen: function(enabled) {" +
                  "      try { window.edallNative.setFullscreen(enabled === true); return Promise.resolve(true); }" +
                  "      catch(e) { return Promise.resolve(false); }" +
                  "    }" +
                  "  };" +
                  "  var hero = document.getElementById('desktopDownloadHero');" +
                  "  if (hero) hero.style.display = 'none';" +
                  "})();";

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);

                  try {
                      NewPipe.init(
                          new OkHttpDownloader(),
                          new Localization("en", "US"),
                          new ContentCountry("US")
                      );
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  ws.setUserAgentString(ws.getUserAgentString() + " EdAllAndroid/3.0 EdAllDesktop/2.0");

                  webView.addJavascriptInterface(new WebAppInterface(this), "edallNative");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onPageCommitVisible(WebView view, String url) {
                          super.onPageCommitVisible(view, url);
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getRequestedOrientation() == ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE) {
                              setDesktopFullscreen(false);
                          } else if (webView != null && webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }
                      }
                  });

                  if (savedInstanceState == null) {
                      webView.loadUrl(PLATFORM_URL);
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) webView.saveState(outState);
              }

              public void setDesktopFullscreen(boolean enabled) {
                  if (enabled) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          WindowInsetsController controller = getWindow().getInsetsController();
                          if (controller != null) {
                              controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                              controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                          }
                      } else {
                          getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          );
                      }
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          WindowInsetsController controller = getWindow().getInsetsController();
                          if (controller != null) {
                              controller.show(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          }
                      } else {
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                      }
                  }
              }
          }
          EOF

          # 8. Manifest
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="EdAll"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 9. App icon fallback
          if ! curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://edall.lovable.app/__l5e/assets-v1/71bdb918-9fe9-4771-a708-5fa36185f009/edall.png" \
            --output android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png; then
            echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlShc0AAAAASUVORK5CYII=' \
              | base64 --decode > android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.6'
          cache-provider: basic

      - name: Build unsigned Release APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleRelease --stacktrace

      - name: Locate built unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK="$(find android-project/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Could not find generated APK in android-project/app/build/outputs/apk/release"
            exit 1
          fi
          echo "UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"
          mkdir -p dist

      - name: Load or create signing key
        shell: bash
        env:
          EDALL_KEYSTORE_BASE64: ${{ secrets.EDALL_KEYSTORE_BASE64 }}
          EDALL_KEYSTORE_PASSWORD: ${{ secrets.EDALL_KEYSTORE_PASSWORD }}
          EDALL_KEY_ALIAS: ${{ secrets.EDALL_KEY_ALIAS }}
          EDALL_KEY_PASSWORD: ${{ secrets.EDALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_DIR="${RUNNER_TEMP}/edall-keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_PATH="$KEYSTORE_DIR/edall-release.jks"

          if [ -n "${EDALL_KEYSTORE_BASE64:-}" ]; then
            echo "$EDALL_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$EDALL_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$EDALL_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$EDALL_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo '::warning::No EDALL signing secrets found. Generating temporary release key...'
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_ALIAS='edall'
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=EdAll, OU=App, O=EdAll, L=Cairo, ST=Cairo, C=EG'

            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Align, sign, and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          ALIGNED_APK="${RUNNER_TEMP}/aligned.apk"
          FINAL_APK='dist/EdAll.apk'

          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose "$FINAL_APK"
          echo "Signed release APK created at $FINAL_APK"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: EdAll Education Release
          draft: false
          prerelease: false
          files: dist/EdAll.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
