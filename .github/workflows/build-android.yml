name: Build Android APK (ED ALL)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'Education'

permissions:
  contents: write

concurrency:
  group: edall-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_API_LEVEL: '34'
      ANDROID_BUILD_TOOLS: '34.0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK & Accept Licenses
        shell: bash
        run: |
          set -euo pipefail
          echo "Using preinstalled Android SDK at: $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a533e3304e4e82ee060481f4dd7\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "859f317696f67ef43ef2a1a76adc29be0484f789\nd97544112579707560e3931a3606ccd8324f6bef\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          printf "601085b94cd77f0b54ff86406957099ebe79b4d6\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-provider: basic

      - name: Scaffold Complete Android Project
        run: |
          rm -rf android-project
          mkdir -p android-project/app/src/main/java/com/edall/platform
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/drawable

          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "EdAllAndroid"
          include ':app'
          EOF

          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.edall.platform'
              compileSdk 34

              defaultConfig {
                  applicationId "com.edall.platform"
                  minSdk 24
                  targetSdk 34
                  versionCode 100010
                  versionName "3.2.0"

                  vectorDrawables.useSupportLibrary = true
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ED ALL</string>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.EdAll" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#0f1115</item>
                  <item name="android:statusBarColor">#0f1115</item>
                  <item name="android:navigationBarColor">#0f1115</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.EdAll"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:hardwareAccelerated="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/edall/platform/OkHttpDownloader.java
          package com.edall.platform;

          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException;

          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.TimeUnit;

          import okhttp3.Cookie;
          import okhttp3.CookieJar;
          import okhttp3.HttpUrl;
          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.RequestBody;

          public class OkHttpDownloader extends Downloader {
              private static OkHttpDownloader instance;
              private final OkHttpClient client;

              private OkHttpDownloader() {
                  this.client = new OkHttpClient.Builder()
                          .cookieJar(new CookieJar() {
                              private final HashMap<String, List<Cookie>> cookieStore = new HashMap<>();
                              @Override
                              public void saveFromResponse(HttpUrl url, List<Cookie> cookies) {
                                  cookieStore.put(url.host(), cookies);
                              }
                              @Override
                              public List<Cookie> loadForRequest(HttpUrl url) {
                                  List<Cookie> cookies = cookieStore.get(url.host());
                                  return cookies != null ? cookies : new ArrayList<>();
                              }
                          })
                          .connectTimeout(25, TimeUnit.SECONDS)
                          .readTimeout(30, TimeUnit.SECONDS)
                          .followRedirects(true)
                          .followSslRedirects(true)
                          .build();
              }

              public static synchronized OkHttpDownloader getInstance() {
                  if (instance == null) {
                      instance = new OkHttpDownloader();
                  }
                  return instance;
              }

              @Override
              public Response execute(Request request) throws IOException, ReCaptchaException {
                  String httpMethod = request.httpMethod();
                  String url = request.url();
                  byte[] dataToSend = request.dataToSend();

                  okhttp3.Request.Builder requestBuilder = new okhttp3.Request.Builder().url(url);

                  requestBuilder.header("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36");
                  requestBuilder.header("Accept-Language", "en-US,en;q=0.9,ar;q=0.8");

                  for (Map.Entry<String, List<String>> entry : request.headers().entrySet()) {
                      for (String val : entry.getValue()) {
                          requestBuilder.addHeader(entry.getKey(), val);
                      }
                  }

                  if ("POST".equalsIgnoreCase(httpMethod)) {
                      RequestBody body = RequestBody.create(
                              dataToSend != null ? dataToSend : new byte[0],
                              MediaType.parse("application/json; charset=utf-8")
                      );
                      requestBuilder.post(body);
                  } else if ("HEAD".equalsIgnoreCase(httpMethod)) {
                      requestBuilder.head();
                  } else {
                      requestBuilder.get();
                  }

                  okhttp3.Response response = client.newCall(requestBuilder.build()).execute();

                  if (response.code() == 429) {
                      response.close();
                      throw new ReCaptchaException("reCaptcha required by YouTube (429)", url);
                  }

                  String responseBodyToReturn = response.body() != null ? response.body().string() : "";
                  Map<String, List<String>> responseHeaders = new HashMap<>(response.headers().toMultimap());

                  return new Response(
                          response.code(),
                          response.message(),
                          responseHeaders,
                          responseBodyToReturn,
                          response.request().url().toString()
                  );
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/edall/platform/WebAppInterface.java
          package com.edall.platform;

          import android.webkit.JavascriptInterface;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.ServiceList;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.StreamInfo;
          import org.schabi.newpipe.extractor.stream.VideoStream;

          import java.util.List;

          public class WebAppInterface {
              private final MainActivity activity;

              public WebAppInterface(MainActivity activity) {
                  this.activity = activity;
              }

              @JavascriptInterface
              public void reloadApp() {
                  activity.reloadApp();
              }

              @JavascriptInterface
              public void openExternalUrl(String url) {
                  activity.openExternal(url);
              }

              @JavascriptInterface
              public void setFullscreen(boolean fullscreen) {
                  activity.setAppFullscreen(fullscreen);
              }

              @JavascriptInterface
              public void extractFormats(final String videoId, final String callbackName) {
                  new Thread(() -> {
                      JSONObject result = new JSONObject();
                      try {
                          String ytUrl = "https://www.youtube.com/watch?v=" + videoId;
                          StreamInfo info = StreamInfo.getInfo(ServiceList.YouTube, ytUrl);

                          JSONArray formatsArray = new JSONArray();
                          List<VideoStream> videoStreams = info.getVideoStreams();
                          List<AudioStream> audioStreams = info.getAudioStreams();

                          String bestAudioUrl = null;
                          if (audioStreams != null && !audioStreams.isEmpty()) {
                              bestAudioUrl = audioStreams.get(0).getContent();
                          }

                          if (videoStreams != null) {
                              for (VideoStream vs : videoStreams) {
                                  JSONObject f = new JSONObject();
                                  f.put("quality", vs.getResolution());
                                  f.put("resolution", vs.getResolution());
                                  f.put("url", vs.getContent());
                                  f.put("isMuxed", vs.isVideoOnly() ? false : true);
                                  f.put("audioUrl", bestAudioUrl != null ? bestAudioUrl : "");
                                  formatsArray.put(f);
                              }
                          }

                          if (formatsArray.length() == 0) {
                              result.put("fallback", true);
                              result.put("error", "No extractable streams");
                          } else {
                              result.put("formats", formatsArray);
                              result.put("audioUrl", bestAudioUrl != null ? bestAudioUrl : "");
                          }
                      } catch (Exception e) {
                          try {
                              result.put("fallback", true);
                              result.put("error", e.getMessage() != null ? e.getMessage() : "Extraction failed");
                          } catch (Exception ignored) {}
                      }

                      final String jsonPayload = result.toString();
                      activity.runOnUiThread(() -> {
                          String js = "if(window['" + callbackName + "']){window['" + callbackName + "'](" + jsonPayload + ");}";
                          activity.getWebView().evaluateJavascript(js, null);
                      });
                  }).start();
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/edall/platform/MainActivity.java
          package com.edall.platform;

          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.net.ConnectivityManager;
          import android.net.NetworkInfo;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.ConsoleMessage;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.localization.ContentCountry;
          import org.schabi.newpipe.extractor.localization.Localization;

          public class MainActivity extends AppCompatActivity {

              private static final String APP_URL = "https://edall.lovable.app/ed_master.html";
              private WebView mWebView;
              private boolean isOfflinePageShown = false;

              private static final String OFFLINE_HTML = "<!doctype html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\"><title>ED ALL</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#f2f2f2;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center}.box{max-width:380px;width:100%;padding:32px 24px;background:#16181f;border-radius:20px;border:1px solid rgba(255,255,255,0.08);box-shadow:0 16px 36px rgba(0,0,0,0.6)}svg{display:inline-block;margin-bottom:18px}h1{font-size:1.25rem;margin:0 0 10px;font-weight:700;line-height:1.5}p{font-size:0.9rem;opacity:.75;margin:0 0 26px;line-height:1.4}.btn{display:block;width:100%;padding:14px 20px;border-radius:12px;background:#2f7cf6;color:#fff;text-decoration:none;font-weight:700;font-size:1rem;border:none;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;transition:transform 0.1s,background 0.2s}.btn:active{transform:scale(0.98);background:#2361c4}</style></head><body><div class=\"box\"><svg width=\"56\" height=\"56\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#f87171\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"1\" y1=\"1\" x2=\"23\" y2=\"23\"/><path d=\"M16.72 11.06A10.94 10.94 0 0 1 19 12.55\"/><path d=\"M5 12.55a10.94 10.94 0 0 1 5.17-2.39\"/><path d=\"M10.71 5.05A16 16 0 0 1 22.58 9\"/><path d=\"M1.42 9a15.91 15.91 0 0 1 4.7-2.88\"/><path d=\"M8.53 16.11a6 6 0 0 1 6.95 0\"/><line x1=\"12\" y1=\"20\" x2=\"12.01\" y2=\"20\"/></svg><h1>تحقق من اتصالك بالإنترنت وأعد تشغيل البرنامج</h1><p>Check your internet connection and restart the app.</p><button class=\"btn\" onclick=\"if(window._AndroidBridge){window._AndroidBridge.reloadApp();}else{location.reload();}\">إعادة التشغيل</button></div></body></html>";

              private static final String JS_BRIDGE_SHIM =
                      "(function(){" +
                      "  try{" +
                      "    window.edallAndroid = window.edallAndroid || {};" +
                      "    var s = document.createElement('style');" +
                      "    s.innerHTML = '#desktopDownloadHero { display: none !important; }';" +
                      "    (document.head || document.documentElement).appendChild(s);" +
                      "    window._edOpenFallback = function(videoId){" +
                      "      var c = document.getElementById('lessonPlayerMount');" +
                      "      if(!c) return;" +
                      "      var p = document.getElementById('lessonPlayerWrapper');" +
                      "      if(p) p.remove();" +
                      "      c.innerHTML = '<div id=\"lessonPlayerWrapper\" class=\"relative w-full aspect-video rounded-2xl overflow-hidden bg-black shadow-2xl\"><div id=\"lessonPlayerContainer\" class=\"w-full h-full\"><div id=\"lessonPlyrEmbed\" data-plyr-provider=\"youtube\" data-plyr-embed-id=\"' + videoId + '\"></div></div></div>';" +
                      "      try {" +
                      "        if (window._currentPlyr) { window._currentPlyr.destroy(); }" +
                      "        window._currentPlyr = new Plyr('#lessonPlyrEmbed', {" +
                      "          youtube: { noCookie: false, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1 }," +
                      "          controls: ['play-large','play','progress','current-time','mute','volume','captions','settings','pip','airplay','fullscreen']" +
                      "        });" +
                      "      } catch(err){}" +
                      "    };" +
                      "    window.edallDesktop = {" +
                      "      isDesktop: true," +
                      "      getYoutubeFormats: function(videoId, callback){" +
                      "        var cbName = '__ed_cb_' + Math.floor(Math.random()*1000000);" +
                      "        window[cbName] = function(data){" +
                      "          try { delete window[cbName]; } catch(e){}" +
                      "          if (!data || data.fallback || !data.formats || data.formats.length === 0) {" +
                      "            window._edOpenFallback(videoId);" +
                      "            return;" +
                      "          }" +
                      "          callback(data);" +
                      "        };" +
                      "        if (window._AndroidBridge) {" +
                      "          window._AndroidBridge.extractFormats(videoId, cbName);" +
                      "        } else {" +
                      "          window._edOpenFallback(videoId);" +
                      "        }" +
                      "      }," +
                      "      setVideoFullscreen: function(fs){" +
                      "        if(window._AndroidBridge) window._AndroidBridge.setFullscreen(fs);" +
                      "      }" +
                      "    };" +
                      "  } catch(e) {}" +
                      "})();";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                          WindowManager.LayoutParams.FLAG_SECURE,
                          WindowManager.LayoutParams.FLAG_SECURE
                  );

                  try {
                      NewPipe.init(OkHttpDownloader.getInstance(), new Localization("en", "US"), ContentCountry.DEFAULT);
                  } catch (Exception ignored) {}

                  mWebView = new WebView(this);
                  setContentView(mWebView);

                  configureWebView();

                  if (!isNetworkConnected()) {
                      showOfflineScreen();
                  } else {
                      mWebView.loadUrl(APP_URL + "?live_sync=" + System.currentTimeMillis());
                  }
              }

              private boolean isNetworkConnected() {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm != null) {
                          NetworkInfo activeNetwork = cm.getActiveNetworkInfo();
                          return activeNetwork != null && activeNetwork.isConnected();
                      }
                  } catch (Exception ignored) {}
                  return false;
              }

              public void showOfflineScreen() {
                  isOfflinePageShown = true;
                  runOnUiThread(() -> {
                      mWebView.stopLoading();
                      mWebView.loadDataWithBaseURL("about:blank", OFFLINE_HTML, "text/html", "UTF-8", null);
                  });
              }

              public void reloadApp() {
                  runOnUiThread(() -> {
                      isOfflinePageShown = false;
                      if (!isNetworkConnected()) {
                          showOfflineScreen();
                      } else {
                          mWebView.clearCache(true);
                          mWebView.loadUrl(APP_URL + "?live_sync=" + System.currentTimeMillis());
                      }
                  });
              }

              public void openExternal(String url) {
                  try {
                      Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(browserIntent);
                  } catch (Exception ignored) {}
              }

              public void setAppFullscreen(boolean fullscreen) {
                  runOnUiThread(() -> {
                      if (fullscreen) {
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                          getWindow().getDecorView().setSystemUiVisibility(
                                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          );
                      } else {
                          setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                      }
                  });
              }

              private boolean handleUrlNavigation(String url) {
                  if (url == null || url.isEmpty()) return false;
                  String lower = url.toLowerCase();

                  if (url.startsWith("intent:") || url.startsWith("whatsapp:") || url.startsWith("tg:") ||
                          url.startsWith("tel:") || url.startsWith("mailto:")) {
                      try {
                          Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                          startActivity(intent);
                          return true;
                      } catch (Exception e) {
                          return true;
                      }
                  }

                  boolean isDocument = lower.endsWith(".pdf") || lower.contains(".pdf?") ||
                          lower.contains("drive.google.com") || lower.contains("4shared.com") ||
                          lower.endsWith(".docx") || lower.endsWith(".doc") ||
                          lower.endsWith(".xlsx") || lower.endsWith(".pptx");

                  boolean isOurPlatform = url.startsWith("https://edall.lovable.app") ||
                          url.startsWith("https://id-preview--") ||
                          url.contains("lovable.app/ed_master.html");

                  if (isDocument || !isOurPlatform) {
                      openExternal(url);
                      return true;
                  }

                  return false;
              }

              private void configureWebView() {
                  WebSettings settings = mWebView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setSupportMultipleWindows(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);

                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);

                  mWebView.clearCache(true);
                  mWebView.addJavascriptInterface(new WebAppInterface(this), "_AndroidBridge");

                  mWebView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrlNavigation(request.getUrl().toString());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleUrlNavigation(url);
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          if (!isOfflinePageShown) {
                              view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                          }
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          if (!isOfflinePageShown) {
                              view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                          }
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) {
                              showOfflineScreen();
                          }
                      }

                      @Override
                      public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                          showOfflineScreen();
                      }
                  });

                  mWebView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, android.os.Message resultMsg) {
                          WebView tempWebView = new WebView(MainActivity.this);
                          tempWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                                  return handleUrlNavigation(req.getUrl().toString());
                              }

                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, String u) {
                                  return handleUrlNavigation(u);
                              }
                          });
                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(tempWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }

                      @Override
                      public boolean onConsoleMessage(ConsoleMessage consoleMessage) {
                          return true;
                      }
                  });
              }

              public WebView getWebView() {
                  return mWebView;
              }

              @Override
              public void onBackPressed() {
                  if (mWebView != null && mWebView.canGoBack() && !isOfflinePageShown) {
                      mWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (mWebView != null && !isOfflinePageShown) {
                      mWebView.evaluateJavascript(JS_BRIDGE_SHIM, null);
                  }
              }
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#2f7cf6"
                  android:pathData="M54,18 L86,34 L86,74 L54,90 L22,74 L22,34 Z" />
              <path
                  android:fillColor="#ffffff"
                  android:pathData="M46,40 L62,54 L46,68 Z" />
          </vector>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.xml
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/black" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          echo '<resources><color name="black">#0f1115</color></resources>' > android-project/app/src/main/res/values/colors.xml
          touch android-project/app/proguard-rules.pro

      - name: Build Release APK with Gradle
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleRelease --stacktrace

      - name: Sign & Align Release APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK: $UNSIGNED_APK"
          test -s "$UNSIGNED_APK"

          KEYSTORE_PATH="edall-release.jks"
          KEYSTORE_PASSWORD="edall_secure_key_2026"
          KEY_ALIAS="edall"
          KEY_PASSWORD="edall_secure_key_2026"

          cat << 'KEYSTORE_B64_EOF' | base64 --decode > "$KEYSTORE_PATH"
          
          KEYSTORE_B64_EOF

          BUILD_TOOLS="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" aligned-release.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out ../EdAll.apk \
            aligned-release.apk

          "$BUILD_TOOLS/apksigner" verify --verbose ../EdAll.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-Android-APK
          path: EdAll.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        with:
          tag_name: Education
          name: 'ED ALL Mobile Platform'
          draft: false
          prerelease: false
          files: EdAll.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
