name: Build EdAll Android App (APK)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: edall-android-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build-apk:
    name: Build Integrated Android App (Release APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Scaffold complete Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android-project/app/src/main/java/com/edall/app
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/gradle/wrapper

          # 1. Gradle properties
          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          android.nonTransitiveRClass=true
          EOF

          # 2. Gradle settings
          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "EdAll"
          include ':app'
          EOF

          # 3. Root Gradle build file
          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 4. App Gradle build file
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          def ciBuildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

          android {
              namespace 'com.edall.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.edall.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 100000 + ciBuildNumber
                  versionName "3.1.${ciBuildNumber}"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += [
                          'META-INF/DEPENDENCIES',
                          'META-INF/LICENSE',
                          'META-INF/LICENSE.txt',
                          'META-INF/license.txt',
                          'META-INF/NOTICE',
                          'META-INF/NOTICE.txt',
                          'META-INF/notice.txt',
                          'META-INF/INDEX.LIST',
                          'META-INF/*.kotlin_module'
                      ]
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
          }
          EOF

          # 5. OkHttp downloader with correct POST handling and cookie store
          cat << 'EOF' > android-project/app/src/main/java/com/edall/app/OkHttpDownloader.java
          package com.edall.app;

          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException;

          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.TimeUnit;

          import okhttp3.Cookie;
          import okhttp3.CookieJar;
          import okhttp3.Headers;
          import okhttp3.HttpUrl;
          import okhttp3.OkHttpClient;
          import okhttp3.RequestBody;
          import okhttp3.ResponseBody;

          public class OkHttpDownloader extends Downloader {
              private final OkHttpClient client;

              public OkHttpDownloader(OkHttpClient.Builder builder) {
                  final Map<String, List<Cookie>> cookieStore = new HashMap<>();
                  this.client = builder
                          .cookieJar(new CookieJar() {
                              @Override
                              public void saveFromResponse(HttpUrl url, List<Cookie> cookies) {
                                  cookieStore.put(url.host(), cookies);
                              }
                              @Override
                              public List<Cookie> loadForRequest(HttpUrl url) {
                                  List<Cookie> cookies = cookieStore.get(url.host());
                                  return cookies != null ? cookies : new ArrayList<Cookie>();
                              }
                          })
                          .connectTimeout(25, TimeUnit.SECONDS)
                          .readTimeout(30, TimeUnit.SECONDS)
                          .build();
              }

              @Override
              public Response execute(Request request) throws IOException, ReCaptchaException {
                  String method = request.httpMethod();
                  String url = request.url();
                  byte[] dataToSend = request.dataToSend();

                  RequestBody requestBody = null;
                  if (dataToSend != null) {
                      requestBody = RequestBody.create(dataToSend, null);
                  } else if ("POST".equalsIgnoreCase(method) || "PUT".equalsIgnoreCase(method) || "PATCH".equalsIgnoreCase(method)) {
                      requestBody = RequestBody.create(new byte[0], null);
                  }

                  okhttp3.Request.Builder builder = new okhttp3.Request.Builder()
                          .method(method, requestBody)
                          .url(url)
                          .addHeader("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36");

                  for (Map.Entry<String, List<String>> pair : request.headers().entrySet()) {
                      builder.removeHeader(pair.getKey());
                      for (String val : pair.getValue()) {
                          builder.addHeader(pair.getKey(), val);
                      }
                  }

                  okhttp3.Response response = client.newCall(builder.build()).execute();
                  if (response.code() == 429) {
                      response.close();
                      throw new ReCaptchaException("reCaptcha required", url);
                  }

                  ResponseBody body = response.body();
                  String responseBodyText = body != null ? body.string() : "";
                  Headers headers = response.headers();
                  Map<String, List<String>> responseHeaders = new HashMap<>(headers.toMultimap());

                  return new Response(
                          response.code(),
                          response.message(),
                          responseHeaders,
                          responseBodyText,
                          response.request().url().toString()
                  );
              }
          }
          EOF

          # 6. WebAppInterface with safe stream extraction and fallback flag
          cat << 'EOF' > android-project/app/src/main/java/com/edall/app/WebAppInterface.java
          package com.edall.app;

          import android.webkit.JavascriptInterface;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.ServiceList;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.StreamInfo;
          import org.schabi.newpipe.extractor.stream.VideoStream;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public class WebAppInterface {
              private final MainActivity activity;

              public WebAppInterface(MainActivity activity) {
                  this.activity = activity;
              }

              @JavascriptInterface
              public boolean isApp() { return true; }

              @JavascriptInterface
              public boolean isAndroid() { return true; }

              @JavascriptInterface
              public void setFullscreen(boolean enabled) {
                  activity.runOnUiThread(() -> activity.setDesktopFullscreen(enabled));
              }

              @JavascriptInterface
              public String extractFormats(String videoId) {
                  try {
                      if (videoId == null || videoId.trim().isEmpty()) {
                          return "{\"error\":\"Invalid video ID\",\"fallback\":true}";
                      }
                      String watchUrl = "https://www.youtube.com/watch?v=" + videoId.trim();
                      StreamInfo info = StreamInfo.getInfo(ServiceList.YouTube, watchUrl);

                      Map<Integer, VideoStream> bestByHeight = new HashMap<>();

                      // 1. Prioritize muxed streams (audio + video together)
                      for (VideoStream vs : info.getVideoStreams()) {
                          int h = vs.getHeight();
                          if (h <= 0 || vs.getContent() == null || vs.getContent().isEmpty()) continue;
                          if (!bestByHeight.containsKey(h) || (vs.getBitrate() > bestByHeight.get(h).getBitrate())) {
                              bestByHeight.put(h, vs);
                          }
                      }

                      // 2. Add video-only streams if no muxed stream exists
                      for (VideoStream vs : info.getVideoOnlyStreams()) {
                          int h = vs.getHeight();
                          if (h <= 0 || vs.getContent() == null || vs.getContent().isEmpty()) continue;
                          if (!bestByHeight.containsKey(h)) {
                              bestByHeight.put(h, vs);
                          }
                      }

                      if (bestByHeight.isEmpty()) {
                          return "{\"error\":\"No streams found\",\"fallback\":true}";
                      }

                      List<VideoStream> sortedVideos = new ArrayList<>(bestByHeight.values());
                      Collections.sort(sortedVideos, (a, b) -> Integer.compare(b.getHeight(), a.getHeight()));

                      AudioStream bestAudio = null;
                      for (AudioStream as : info.getAudioStreams()) {
                          if (as.getContent() == null || as.getContent().isEmpty()) continue;
                          if (bestAudio == null || as.getAverageBitrate() > bestAudio.getAverageBitrate()) {
                              bestAudio = as;
                          }
                      }

                      JSONObject root = new JSONObject();
                      root.put("title", info.getName() != null ? info.getName() : "Video");
                      root.put("expiresAt", System.currentTimeMillis() + 6 * 3600 * 1000);

                      JSONArray videosArr = new JSONArray();
                      for (VideoStream vs : sortedVideos) {
                          JSONObject vObj = new JSONObject();
                          vObj.put("h", vs.getHeight());
                          vObj.put("url", vs.getContent());
                          vObj.put("hasAudio", !vs.isVideoOnly());
                          videosArr.put(vObj);
                      }
                      root.put("videos", videosArr);

                      if (bestAudio != null) {
                          JSONObject aObj = new JSONObject();
                          aObj.put("url", bestAudio.getContent());
                          root.put("audio", aObj);
                      }

                      return root.toString();
                  } catch (Exception e) {
                      try {
                          JSONObject err = new JSONObject();
                          err.put("error", e.getMessage() != null ? e.getMessage() : "Extraction failed");
                          err.put("fallback", true);
                          return err.toString();
                      } catch (Exception ignored) {
                          return "{\"error\":\"Extraction failed\",\"fallback\":true}";
                      }
                  }
              }
          }
          EOF

          # 7. MainActivity with fail-safe video wrapper and instant sync
          cat << 'EOF' > android-project/app/src/main/java/com/edall/app/MainActivity.java
          package com.edall.app;

          import android.annotation.SuppressLint;
          import android.content.pm.ActivityInfo;
          import android.graphics.Bitmap;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.localization.ContentCountry;
          import org.schabi.newpipe.extractor.localization.Localization;
          import okhttp3.OkHttpClient;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static final String PLATFORM_URL = "https://edall.lovable.app/ed_master.html";

              private static final String JS_BRIDGE_SHIM =
                  "(function() {" +
                  "  if (window._edallAndroidInit) return;" +
                  "  window._edallAndroidInit = true;" +
                  "  window.edallAndroid = {" +
                  "    isApp: function() { return true; }," +
                  "    isAndroid: function() { return true; }" +
                  "  };" +
                  "  function hideHero() {" +
                  "    var h = document.getElementById('desktopDownloadHero');" +
                  "    if (h) h.style.display = 'none';" +
                  "  }" +
                  "  hideHero();" +
                  "  document.addEventListener('DOMContentLoaded', hideHero);" +
                  "  window._edOpenFallback = function(container, vid, btn, num, hideLbl, showLbl) {" +
                  "    if (!container) return;" +
                  "    try { if (container._desktopCleanup) { container._desktopCleanup(); container._desktopCleanup = null; } } catch(e){}" +
                  "    var cls = 'edv-' + Math.random().toString(36).slice(2, 9);" +
                  "    var wrap = document.createElement('div');" +
                  "    wrap.className = 'edv-wrap ' + cls;" +
                  "    wrap.style.cssText = 'position:relative;border-radius:var(--radius);overflow:hidden;background:#000;';" +
                  "    var host = document.createElement('div');" +
                  "    host.className = 'plyr__video-embed';" +
                  "    host.setAttribute('data-plyr-provider', 'youtube');" +
                  "    host.setAttribute('data-plyr-embed-id', vid);" +
                  "    wrap.appendChild(host);" +
                  "    container.innerHTML = '';" +
                  "    container.appendChild(wrap);" +
                  "    container.style.display = 'block';" +
                  "    var ytVars = { noCookie: true, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1, controls: 0, disablekb: 1, playsinline: 1, fs: 0 };" +
                  "    try {" +
                  "      container._p = new Plyr(host, {" +
                  "        controls: ['play-large','rewind','play','fast-forward','progress','current-time','mute','volume','captions','settings','pip','fullscreen']," +
                  "        settings: ['captions','speed']," +
                  "        speed: { selected: 1, options: [0.5,0.75,1,1.25,1.5,1.75,2] }," +
                  "        seekTime: 10, invertTime: false, clickToPlay: true, hideControls: true," +
                  "        keyboard: { focused: true, global: false }, tooltips: { controls: true, seek: true }," +
                  "        fullscreen: { enabled: true, fallback: true, iosNative: false, container: '.' + cls }," +
                  "        youtube: ytVars" +
                  "      });" +
                  "      if (typeof _edAddQualityMenu === 'function') { _edAddQualityMenu(container._p, wrap, vid); }" +
                  "      if (typeof getWatermarkText === 'function') {" +
                  "        var mark = getWatermarkText();" +
                  "        if (mark && typeof buildWatermarkLayer === 'function') {" +
                  "          wrap.appendChild(buildWatermarkLayer(mark));" +
                  "          if (typeof guardWatermark === 'function') guardWatermark(wrap, mark);" +
                  "        }" +
                  "      }" +
                  "      btn.innerHTML = '<i class=\"fas fa-eye-slash\"></i> ' + hideLbl + ' (' + num + ')';" +
                  "    } catch(err) {" +
                  "      if (typeof _edClose === 'function') _edClose(container);" +
                  "      btn.innerHTML = '<i class=\"fas fa-play-circle\"></i> ' + showLbl + ' (' + num + ')';" +
                  "    }" +
                  "  };" +
                  "  window.edallDesktop = {" +
                  "    isDesktop: true," +
                  "    isAndroid: true," +
                  "    version: '3.1.0'," +
                  "    getYoutubeFormats: function(vid, force) {" +
                  "      return new Promise(function(resolve, reject) {" +
                  "        setTimeout(function() {" +
                  "          try {" +
                  "            if (!window.edallNative || typeof window.edallNative.extractFormats !== 'function') {" +
                  "              reject(new Error('Native extractor unavailable')); return;" +
                  "            }" +
                  "            var res = window.edallNative.extractFormats(vid);" +
                  "            if (!res) { reject(new Error('No response from native extractor')); return; }" +
                  "            var data = JSON.parse(res);" +
                  "            if (data.error || !data.videos || data.videos.length === 0) {" +
                  "              reject(new Error(data.error || 'No playable streams')); return;" +
                  "            }" +
                  "            resolve(data);" +
                  "          } catch(err) { reject(err); }" +
                  "        }, 10);" +
                  "      });" +
                  "    }," +
                  "    setVideoFullscreen: function(enabled) {" +
                  "      try { if (window.edallNative && typeof window.edallNative.setFullscreen === 'function') { window.edallNative.setFullscreen(enabled === true); } return Promise.resolve(true); }" +
                  "      catch(e) { return Promise.resolve(false); }" +
                  "    }" +
                  "  };" +
                  "  var hookEdOpen = function() {" +
                  "    if (typeof window._edOpen === 'function' && !window._edOpenHooked) {" +
                  "      window._edOpenHooked = true;" +
                  "      var rawEdOpen = window._edOpen;" +
                  "      window._edOpen = async function(btn, containerId, num) {" +
                  "        var container = document.getElementById(containerId);" +
                  "        if (!container) return rawEdOpen(btn, containerId, num);" +
                  "        var showLbl = container.getAttribute('data-show-label') || 'Watch';" +
                  "        var hideLbl = container.getAttribute('data-hide-label') || 'Hide';" +
                  "        if (container.style.display !== 'none' && container.style.display) {" +
                  "          return rawEdOpen(btn, containerId, num);" +
                  "        }" +
                  "        var vid = null;" +
                  "        try { if (typeof _edUnpack === 'function' && btn.dataset) { vid = _edUnpack(btn.dataset.k1, btn.dataset.k2, btn.dataset.k3); } } catch(e){}" +
                  "        btn.disabled = true;" +
                  "        btn.innerHTML = '<i class=\"fas fa-spinner fa-spin\"></i> ' + showLbl + ' (' + num + ')';" +
                  "        try {" +
                  "          if (typeof _edLoadLib === 'function') await _edLoadLib();" +
                  "          if (typeof _edDesktopOpen === 'function' && vid) {" +
                  "            await _edDesktopOpen(container, vid);" +
                  "            btn.innerHTML = '<i class=\"fas fa-eye-slash\"></i> ' + hideLbl + ' (' + num + ')';" +
                  "            btn.disabled = false;" +
                  "            return;" +
                  "          }" +
                  "        } catch(openErr) {" +
                  "          console.warn('[EdAll] Native extractor failed; switching to embedded player:', openErr);" +
                  "          if (vid && container) {" +
                  "            window._edOpenFallback(container, vid, btn, num, hideLbl, showLbl);" +
                  "            btn.disabled = false;" +
                  "            return;" +
                  "          }" +
                  "        }" +
                  "        btn.disabled = false;" +
                  "        return rawEdOpen(btn, containerId, num);" +
                  "      };" +
                  "    }" +
                  "  };" +
                  "  hookEdOpen();" +
                  "  setInterval(hookEdOpen, 1000);" +
                  "})();";

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);

                  try {
                      NewPipe.init(new OkHttpDownloader(new OkHttpClient.Builder()), Localization.DEFAULT, ContentCountry.DEFAULT);
                  } catch (Exception ignored) {
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.clearCache(true);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);
                  ws.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  ws.setUserAgentString(ws.getUserAgentString() + " EdAllAndroid/3.1");

                  webView.addJavascriptInterface(new WebAppInterface(this), "edallNative");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onPageCommitVisible(WebView view, String url) {
                          super.onPageCommitVisible(view, url);
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          super.onReceivedError(view, request, error);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getRequestedOrientation() == ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE) {
                              setDesktopFullscreen(false);
                          } else if (webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              finish();
                          }
                      }
                  });

                  String liveUrl = PLATFORM_URL + "?live_sync=" + System.currentTimeMillis();
                  webView.loadUrl(liveUrl);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      webView.clearCache(true);
                  }
              }

              public void setDesktopFullscreen(boolean enabled) {
                  if (enabled) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          WindowInsetsController controller = getWindow().getInsetsController();
                          if (controller != null) {
                              controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                              controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                          }
                      } else {
                          getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          );
                      }
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          WindowInsetsController controller = getWindow().getInsetsController();
                          if (controller != null) {
                              controller.show(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          }
                      } else {
                          getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                      }
                  }
              }
          }
          EOF

          # 8. AndroidManifest.xml
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="EdAll"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 9. Launcher icon
          if ! curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://edall.lovable.app/__l5e/assets-v1/71bdb918-9fe9-4771-a708-5fa36185f009/edall.png" \
            --output android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png; then
            echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9WlShc0AAAAASUVORK5CYII=' \
              | base64 --decode > android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

          # 10. Gradle wrapper properties
          cat << 'EOF' > android-project/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-provider: basic

      - name: Build unsigned release APK
        working-directory: android-project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleRelease --stacktrace

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          fi

          test -n "${UNSIGNED_APK:-}"
          test -s "$UNSIGNED_APK"
          cp "$UNSIGNED_APK" "$RUNNER_TEMP/EdAll-unsigned.apk"
          echo "UNSIGNED_APK=$RUNNER_TEMP/EdAll-unsigned.apk" >> "$GITHUB_ENV"

      - name: Load or create fixed signing key
        shell: bash
        env:
          EDALL_KEYSTORE_BASE64: ${{ secrets.EDALL_KEYSTORE_BASE64 }}
          EDALL_KEYSTORE_PASSWORD: ${{ secrets.EDALL_KEYSTORE_PASSWORD }}
          EDALL_KEY_ALIAS: ${{ secrets.EDALL_KEY_ALIAS }}
          EDALL_KEY_PASSWORD: ${{ secrets.EDALL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/edall-release.keystore"

          if [ -n "${EDALL_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$EDALL_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            KEYSTORE_PASSWORD="${EDALL_KEYSTORE_PASSWORD:-edall_secure_key_2026}"
            KEY_ALIAS="${EDALL_KEY_ALIAS:-edall}"
            KEY_PASSWORD="${EDALL_KEY_PASSWORD:-edall_secure_key_2026}"
          else
            echo "Using fixed deterministic EdAll release keystore..."
            cat << 'KEYSTORE_B64_EOF' | base64 --decode > "$KEYSTORE_PATH"
          
          KEYSTORE_B64_EOF
            KEYSTORE_PASSWORD="edall_secure_key_2026"
            KEY_ALIAS="edall"
            KEY_PASSWORD="edall_secure_key_2026"
          fi

          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "EDALL_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "EDALL_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "EDALL_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "EDALL_SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Align, sign, and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ALIGNED_APK="$RUNNER_TEMP/EdAll-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/EdAll.apk"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -s "$UNSIGNED_APK"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$EDALL_KEYSTORE_PATH" \
            --ks-key-alias "$EDALL_SIGNING_KEY_ALIAS" \
            --ks-pass env:EDALL_SIGNING_STORE_PASSWORD \
            --key-pass env:EDALL_SIGNING_KEY_PASSWORD \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 "$SIGNED_APK"
          test -s "$SIGNED_APK"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$SIGNED_APK" "$GITHUB_WORKSPACE/dist/EdAll.apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-Android-APK
          path: dist/EdAll.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Education
          name: EdAll Education Release
          target_commitish: ${{ github.sha }}
          files: dist/EdAll.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
