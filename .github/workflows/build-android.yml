name: Build EdAll Android App (APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Download Offline Platform Snapshot
        run: |
          mkdir -p android-project/app/src/main/assets
          curl -s -L "https://edall.lovable.app/ed_master.html" -o android-project/app/src/main/assets/platform.html
          echo "Downloaded snapshot size: $(wc -c < android-project/app/src/main/assets/platform.html) bytes"

      - name: Create Android Project Files
        run: |
          mkdir -p android-project/app/src/main/java/com/edall/app
          mkdir -p android-project/app/src/main/res/values

          # 1. gradle.properties
          cat << 'EOF' > android-project/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # 2. settings.gradle
          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "EdAll"
          include ':app'
          EOF

          # 3. Project build.gradle
          cat << 'EOF' > android-project/build.gradle
          buildscript {
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          EOF

          # 4. App build.gradle (With NewPipeExtractor & OkHttp)
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.edall.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.edall.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              packaging {
                  resources {
                      excludes += [
                          'META-INF/DEPENDENCIES',
                          'META-INF/LICENSE',
                          'META-INF/LICENSE.txt',
                          'META-INF/license.txt',
                          'META-INF/NOTICE',
                          'META-INF/NOTICE.txt',
                          'META-INF/notice.txt',
                          'META-INF/ASL2.0',
                          'META-INF/*.kotlin_module'
                      ]
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
          }
          EOF

          # 5. Strings & Themes
          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">ED ALL</string>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#0f172a</item>
                  <item name="android:navigationBarColor">#0f172a</item>
                  <item name="android:statusBarColor">#0f172a</item>
              </style>
          </resources>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. OkHttpDownloader.java (NewPipe Downloader implementation)
          cat << 'EOF' > android-project/app/src/main/java/com/edall/app/OkHttpDownloader.java
          package com.edall.app;

          import org.schabi.newpipe.extractor.downloader.Downloader;
          import org.schabi.newpipe.extractor.downloader.Request;
          import org.schabi.newpipe.extractor.downloader.Response;
          import org.schabi.newpipe.extractor.exceptions.ReCaptchaException;

          import java.io.IOException;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.TimeUnit;

          import okhttp3.OkHttpClient;
          import okhttp3.RequestBody;

          public class OkHttpDownloader extends Downloader {
              private final OkHttpClient client = new OkHttpClient.Builder()
                      .connectTimeout(15, TimeUnit.SECONDS)
                      .readTimeout(20, TimeUnit.SECONDS)
                      .build();

              @Override
              public Response execute(Request request) throws IOException, ReCaptchaException {
                  String httpMethod = request.httpMethod();
                  String url = request.url();
                  Map<String, List<String>> headers = request.headers();
                  byte[] dataToSend = request.dataToSend();

                  okhttp3.Request.Builder builder = new okhttp3.Request.Builder().url(url);
                  if (headers != null) {
                      for (Map.Entry<String, List<String>> entry : headers.entrySet()) {
                          for (String value : entry.getValue()) {
                              builder.addHeader(entry.getKey(), value);
                          }
                      }
                  }

                  if ("POST".equalsIgnoreCase(httpMethod)) {
                      RequestBody body = RequestBody.create(dataToSend != null ? dataToSend : new byte[0]);
                      builder.post(body);
                  } else if ("HEAD".equalsIgnoreCase(httpMethod)) {
                      builder.head();
                  } else {
                      builder.get();
                  }

                  okhttp3.Response response = client.newCall(builder.build()).execute();
                  int code = response.code();
                  String message = response.message();
                  Map<String, List<String>> resHeaders = response.headers().toMultimap();
                  String body = response.body() != null ? response.body().string() : "";
                  String latestUrl = response.request().url().toString();

                  return new Response(code, message, resHeaders, body, latestUrl);
              }
          }
          EOF

          # 8. MainActivity.java (With NewPipeExtractor & window.edallDesktop Bridge)
          cat << 'EOF' > android-project/app/src/main/java/com/edall/app/MainActivity.java
          package com.edall.app;

          import android.annotation.SuppressLint;
          import android.content.pm.ActivityInfo;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.schabi.newpipe.extractor.NewPipe;
          import org.schabi.newpipe.extractor.stream.AudioStream;
          import org.schabi.newpipe.extractor.stream.StreamInfo;
          import org.schabi.newpipe.extractor.stream.VideoStream;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private static boolean newPipeInitialized = false;
              private final ExecutorService executor = Executors.newFixedThreadPool(2);

              private static final String JS_BRIDGE_SHIM = 
                  "javascript:(function() {" +
                  "  if (!window.edallDesktop) {" +
                  "    window.edallDesktop = {" +
                  "      isDesktop: true," +
                  "      isAndroid: true," +
                  "      version: '2.0.0'," +
                  "      getYoutubeFormats: function(vid, force) {" +
                  "        return new Promise(function(resolve, reject) {" +
                  "          try {" +
                  "            var raw = window.edallAndroid.getFormatsSync(vid);" +
                  "            var parsed = JSON.parse(raw);" +
                  "            if (parsed.error) reject(new Error(parsed.error));" +
                  "            else resolve(parsed);" +
                  "          } catch(e) { reject(e); }" +
                  "        });" +
                  "      }," +
                  "      setVideoFullscreen: function(enabled) {" +
                  "        try {" +
                  "          if (window.edallAndroid && window.edallAndroid.setFullscreen) {" +
                  "            window.edallAndroid.setFullscreen(enabled === true);" +
                  "          }" +
                  "        } catch(e) {}" +
                  "        return Promise.resolve(true);" +
                  "      }" +
                  "    };" +
                  "  }" +
                  "  var btn = document.getElementById('desktopDownloadHero');" +
                  "  if (btn) btn.style.display = 'none';" +
                  "})()";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // 1. Block screenshots and screen recordings
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);

                  // 2. Initialize NewPipe Extractor
                  if (!newPipeInitialized) {
                      NewPipe.init(new OkHttpDownloader());
                      newPipeInitialized = true;
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setAllowFileAccess(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setUserAgentString(ws.getUserAgentString() + " EdAllAndroid/2.0");

                  // 3. Register Native Javascript Interface
                  webView.addJavascriptInterface(new WebAppInterface(), "edallAndroid");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript(JS_BRIDGE_SHIM, null);
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request, android.webkit.WebResourceError error) {
                          if (request.isForMainFrame()) {
                              view.loadUrl("file:///android_asset/platform.html");
                          }
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("https://edall.lovable.app/ed_master.html");
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public boolean isApp() { return true; }

                  @JavascriptInterface
                  public boolean isAndroid() { return true; }

                  @JavascriptInterface
                  public String getFormatsSync(String videoId) {
                      try {
                          Future<String> future = executor.submit(() -> extractFormats(videoId));
                          return future.get(25, TimeUnit.SECONDS);
                      } catch (Exception e) {
                          return "{\"error\":\"" + e.getMessage() + "\"}";
                      }
                  }

                  @JavascriptInterface
                  public void setFullscreen(boolean fullscreen) {
                      runOnUiThread(() -> {
                          if (fullscreen) {
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);
                              getWindow().getDecorView().setSystemUiVisibility(
                                  View.SYSTEM_UI_FLAG_FULLSCREEN |
                                  View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                                  View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                                  View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              );
                          } else {
                              setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                          }
                      });
                  }
              }

              private String extractFormats(String videoId) {
                  try {
                      String watchUrl = "https://www.youtube.com/watch?v=" + videoId;
                      StreamInfo info = StreamInfo.getInfo(watchUrl);

                      JSONObject result = new JSONObject();
                      result.put("title", info.getName());

                      Map<Integer, VideoStream> bestVideos = new HashMap<>();
                      List<VideoStream> candidates = new ArrayList<>();
                      if (info.getVideoStreams() != null) candidates.addAll(info.getVideoStreams());
                      if (info.getVideoOnlyStreams() != null) candidates.addAll(info.getVideoOnlyStreams());

                      for (VideoStream vs : candidates) {
                          int h = vs.getHeight();
                          if (h <= 0) continue;
                          if (!bestVideos.containsKey(h)) {
                              bestVideos.put(h, vs);
                          }
                      }

                      List<Integer> heights = new ArrayList<>(bestVideos.keySet());
                      Collections.sort(heights, Collections.reverseOrder());

                      JSONArray videosArray = new JSONArray();
                      for (int h : heights) {
                          VideoStream vs = bestVideos.get(h);
                          JSONObject v = new JSONObject();
                          v.put("h", h);
                          v.put("url", vs.getContent());
                          v.put("hasAudio", !vs.isVideoOnly());
                          videosArray.put(v);
                      }
                      result.put("videos", videosArray);

                      if (info.getAudioStreams() != null && !info.getAudioStreams().isEmpty()) {
                          AudioStream bestAudio = info.getAudioStreams().get(0);
                          JSONObject a = new JSONObject();
                          a.put("url", bestAudio.getContent());
                          result.put("audio", a);
                      } else {
                          result.put("audio", JSONObject.NULL);
                      }

                      return result.toString();
                  } catch (Exception e) {
                      return "{\"error\":\"" + e.getMessage() + "\"}";
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Signed Release APK
        run: |
          cd android-project
          chmod +x gradlew || true
          gradle assembleRelease

      - name: Rename and Package APK
        run: |
          mkdir -p output
          cp android-project/app/build/outputs/apk/release/app-release-unsigned.apk output/EdAll.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EdAll-Android-APK
          path: output/EdAll.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: Education
          name: EdAll Platform Education Release
          files: output/EdAll.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
